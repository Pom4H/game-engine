[package]
name = "world-rigid-kernel"
version = "0.1.0"
edition = "2021"
description = "Rigid sphere/OBB narrowphase and sequential point-impulse solver for game-engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
