[package]
name = "world-structure-kernel"
version = "0.1.0"
edition = "2021"
description = "Rust structural XPBD solver for engine-owned physical deformation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in until native and WASM parity/performance gates have been measured.
default = []
simd-distance = []
# Build the embedded pure linear algebra module without exporting legacy XPBD.
linear-algebra-only = []

[[example]]
name = "distance_bench"
required-features = ["simd-distance"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
