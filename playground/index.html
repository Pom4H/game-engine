<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>game-engine · DSL playground</title><style>__STYLE__</style></head><body>
<header><strong>game-engine</strong><select id="example" aria-label="Демонстрационная сцена"></select><span class="spacer"></span><span id="state" role="status">Загрузка движка…</span></header>
<main><section class="editor" aria-label="Код сцены"><div class="bar"><span class="name">scene.ts</span><button id="apply" title="Ctrl / Cmd + Enter">Применить</button><button id="undo" title="Ctrl / Cmd + Z">↶</button><button id="redo" title="Ctrl / Cmd + Shift + Z">↷</button><button id="save">Скачать .ts</button></div><div class="code"><pre id="highlight" aria-hidden="true"></pre><textarea id="source" aria-label="TypeScript DSL сцены" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div><pre id="error" role="alert"></pre><div class="footer"><span id="scope"></span><span>Автоприменение · 400 мс</span></div></section>
<div id="split" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Ширина редактора" aria-valuenow="43" aria-valuemin="25" aria-valuemax="70"></div>
<section class="preview" aria-label="Рендер движка"><div class="bar"><span class="name">WebGPU · realtime</span><button id="play" disabled>Пауза</button><button id="step" disabled title="Один шаг 1/60 с">Шаг</button><button id="reset" disabled>Сброс</button><button id="sound" disabled>Звук</button><button id="inspector-toggle" aria-expanded="true">Параметры ↔</button><button id="json" disabled>JSON</button><button id="png" disabled>PNG</button></div><div class="viewport"><canvas id="canvas" tabindex="0" aria-label="Интерактивная 3D-сцена"></canvas><div id="notice">Запуск WebGPU…</div><pre id="hud" aria-label="Диагностика, только чтение"></pre><aside id="inspector" aria-label="Параметры из исходного кода"></aside></div><div class="footer"><span id="metrics"></span><span id="keys">Мышь: выбор / камера · колесо: масштаб</span></div></section></main>
<iframe id="compiler" title="Изолированный компилятор" sandbox="allow-scripts"></iframe>
<script>__APP__</script></body></html>
