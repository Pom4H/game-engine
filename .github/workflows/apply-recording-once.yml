name: Integrate and verify render recording once
on:
  push:
    branches: [codex/engine-console]
    paths: ['.github/recording-edits.json', '.github/workflows/apply-recording-once.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact reviewed edits, preserving concurrent files
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          ready = []
          for item in json.loads(Path('.github/recording-edits.json').read_text()):
              path = Path(item['path'])
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['base'], f'Concurrent edit: {path}'
              lines = data.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = [replacement]
              output = ''.join(lines).encode()
              assert hashlib.sha256(output).hexdigest() == item['sha256'], f'Output hash: {path}'
              ready.append((path, output))
          for path, output in ready:
              path.write_bytes(output)
          print('Verified and applied', len(ready), 'files')
          PY
      - name: Isolated verification toolchain (not a project dependency change)
        run: |
          npm install --prefix "$RUNNER_TEMP/recording-toolchain" --ignore-scripts --no-audit --no-fund typescript@5.8.3 @types/node@24
          ln -s "$RUNNER_TEMP/recording-toolchain/node_modules" node_modules
      - name: Typecheck, build, focused recording and native trace tests
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
          node --test test/dsl-playground.mjs test/engine-console.test.mjs test/recording.test.mjs test/chrome-trace.test.mjs | tee "$RUNNER_TEMP/recording-tests.log"
          node tools/docs/build.mjs
          node --check tools/docs/qa.mjs
      - name: Commit only source changes within token permissions
        id: commit
        run: |
          git restore --source=HEAD .github/workflows/dsl-playground.yml
          git add -u
          git rm .github/recording-edits.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(console): record renderer timeline and bounded actual-canvas filmstrip'
          git push origin HEAD:refs/heads/codex/engine-console
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --output="$RUNNER_TEMP/recording-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-integration-evidence
          path: |
            ${{ runner.temp }}/recording-tests.log
            ${{ runner.temp }}/recording-source.tar.gz
          retention-days: 7
  browser:
    needs: integrate
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolated same-toolchain build
        shell: powershell
        run: |
          $tools=Join-Path $env:RUNNER_TEMP 'recording-toolchain'
          npm install --prefix $tools --ignore-scripts --no-audit --no-fund typescript@5.8.3 @types/node@24
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          New-Item -ItemType Junction -Path node_modules -Target (Join-Path $tools 'node_modules') | Out-Null
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          node tools/docs/build.mjs
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Locate native Chrome
        shell: powershell
        run: |
          $candidates=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe","$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")
          $chrome=$candidates | Where-Object {Test-Path $_} | Select-Object -First 1
          if (-not $chrome) {throw 'Native Chrome is required'}
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real WebGPU console recording, filmstrip and existing editor acceptance
        run: node tools/docs/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-webgpu-evidence
          path: artifacts/dsl-playground/
          retention-days: 7
          if-no-files-found: warn
