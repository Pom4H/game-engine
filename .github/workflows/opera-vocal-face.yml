name: Opera Vocal Face
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/vocal-source.ts'
      - 'src/audio/vocal-tract.ts'
      - 'src/audio/opera-vocal.ts'
      - 'src/animation/vocal-face.ts'
      - 'tools/vocal-face-demo/capture-opera-cpu.mjs'
      - 'test/opera-vocal.test.mjs'
      - '.github/workflows/opera-vocal-face.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/vocal-source.test.mjs test/vocal-tract.test.mjs test/opera-vocal.test.mjs test/vocal-face.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/vocal-face-demo/capture-opera-cpu.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: opera-vocal-face-mp4
          path: |
            artifacts/opera-vocal-face/original-opera-full-voice.mp4
            artifacts/opera-vocal-face/poster.png
            artifacts/opera-vocal-face/evidence.json
          retention-days: 14
