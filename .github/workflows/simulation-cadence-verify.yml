name: Simulation cadence verification
on:
  push:
    branches: [perf/simulation-cadence-tiers]
permissions:
  contents: read
concurrency:
  group: perf-simulation-cadence-tiers-verify
  cancel-in-progress: true
jobs:
  core:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run ci
