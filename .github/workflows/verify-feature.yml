name: Verify Game Engine Feature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-feature.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/engine-foundation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run ci
