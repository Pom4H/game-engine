name: Verify Game Engine Feature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-feature.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/engine-foundation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run ci
      - name: WebGPU semantic-material smoke
        run: |
          if not exist artifacts mkdir artifacts
          node dist/cli.js render examples/window-gauntlet.ts --time 0.8 --width 1280 --height 720 --out artifacts/semantic-materials.png
      - run: node tools/check-png.mjs artifacts/semantic-materials.png
