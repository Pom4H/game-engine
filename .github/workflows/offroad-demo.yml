name: Offroad Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/vehicles/**'
      - 'src/environment/**'
      - 'src/procedural/terrain.ts'
      - 'src/scene/**'
      - 'tools/offroad/**'
      - 'test/offroad-vehicle.test.mjs'
      - '.github/workflows/offroad-demo.yml'
  workflow_dispatch:

concurrency:
  group: offroad-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/offroad-vehicle.test.mjs

  render:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Locate hardware Chrome
        run: |
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "$pf86\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw 'Chrome not found on GPU worker' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Render muddy offroad proof
        env:
          RENDER_REQUIRE_HARDWARE: '1'
          RENDER_PROFILING: '1'
          RENDER_WARMUP_FRAMES: '10'
          RENDER_VIDEO_OUTPUT: 'artifacts/offroad.mp4'
          RENDER_VIDEO_FPS: '30'
          RENDER_VIDEO_START: '0'
          RENDER_VIDEO_DURATION: '7.5'
        run: node tools/render-harness.mjs tools/offroad/scene.mjs tools/offroad/views.mjs 1600 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offroad-render
          path: |
            artifacts/offroad.mp4
            artifacts/offroad-*.png
            artifacts/render-hud.json
          retention-days: 14
