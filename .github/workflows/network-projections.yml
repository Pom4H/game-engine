name: Network projections
on:
  push:
    branches: [codex/network-projections]
    paths: ['src/**', 'tools/docs/**', 'test/**', 'tools/network-harness.mjs', 'package.json', '.github/workflows/network-projections.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-projections-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: npm install --prefix tools/docs --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        shell: cmd
        run: bun run typecheck && bun run build
      - name: Network, environment, actual HTTP clients and existing DSL tests
        run: node --test test/environment-bake.test.mjs test/network-projection.test.mjs test/network-host.mjs test/dsl-playground.mjs
      - name: Same-byte publication measurement
        run: node tools/network-harness.mjs
      - run: node tools/docs/build.mjs
      - name: Locate native Chrome
        shell: powershell
        run: |
          $chrome="$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {throw "Native Chrome required"}
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Server pause, replay, two-way editor and airborne rendering
        run: node tools/docs/network-qa.mjs
      - name: Existing native two-way HUD acceptance
        run: node tools/docs/qa.mjs
      - name: Full regressions (failures stay failures)
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/network | Out-Null
          node --test test/*.test.mjs *> artifacts/network/regression.log
          $result=$LASTEXITCODE
          Get-Content artifacts/network/regression.log | Select-Object -Last 15
          exit $result
      - name: Exact tested source
        if: always()
        shell: cmd
        run: |
          git rev-parse HEAD > artifacts/network/commit.txt
          git archive --format=tar.gz -o artifacts/network/source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-projection-evidence
          path: artifacts/network/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-existing-editor-evidence
          path: artifacts/dsl-playground/
          retention-days: 14
          if-no-files-found: warn
