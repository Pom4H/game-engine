name: Render quanta verification
on:
  push:
    branches: [feat/engine-foundation]

permissions:
  contents: read
  statuses: write

concurrency:
  group: render-quanta-verification
  cancel-in-progress: true

jobs:
  gpu-profile:
    runs-on: self-hosted
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cmd /d /s /c "bun install > artifacts\install.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content artifacts/install.log
          $code | Set-Content artifacts/install-exit.txt
          if ($code -ne 0) { exit $code }
      - name: Publish install status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exitCode = if (Test-Path artifacts/install-exit.txt) { (Get-Content artifacts/install-exit.txt -Raw).Trim() } else { "missing" }
          $log = if (Test-Path artifacts/install.log) { Get-Content artifacts/install.log | Where-Object { $_.Trim().Length -gt 0 } } else { @("install.log missing") }
          $last = [string]$log[-1]
          if ($last.Length -gt 120) { $last = $last.Substring(0,120) }
          $description = "exit=$exitCode $last"
          if ($description.Length -gt 140) { $description = $description.Substring(0,140) }
          $state = if ($exitCode -eq "0") { "success" } else { "failure" }
          $payload = @{ state=$state; context="render-quanta/install"; description=$description } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" } -ContentType "application/json" -Body $payload | Out-Null
          exit 0
      - name: Core verification
        if: steps.install.outcome == 'success'
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $old = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & bun run ci 2>&1 | Tee-Object -FilePath artifacts/core.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = $old
          if ($code -ne 0) { exit $code }
      - name: Profile 720p
        if: steps.install.outcome == 'success'
        run: node dist/cli.js profile tools/promo/street.scene.mjs --duration 5 --warmup 2 --width 1280 --height 720 --out artifacts/render-profile-720p.json
      - name: Profile 1080p
        if: steps.install.outcome == 'success'
        run: node dist/cli.js profile tools/promo/street.scene.mjs --duration 5 --warmup 2 --width 1920 --height 1080 --out artifacts/render-profile-1080p.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-quanta-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
