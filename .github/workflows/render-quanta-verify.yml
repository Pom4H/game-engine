name: Render quanta verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/render/**
      - tools/profiling/**
      - .github/workflows/render-quanta-verify.yml

permissions:
  contents: read

concurrency:
  group: render-quanta-verification
  cancel-in-progress: true

jobs:
  gpu-profile:
    runs-on: self-hosted
    timeout-minutes: 25
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Core verification
        run: bun run ci
      - run: if not exist artifacts mkdir artifacts
      - name: Heavy atom profile 720p
        run: node dist/cli.js profile tools/profiling/heavy.scene.mjs --duration 4 --warmup 1.5 --width 1280 --height 720 --out artifacts/heavy-atoms-720p.json
      - name: Heavy atom profile 1080p
        run: node dist/cli.js profile tools/profiling/heavy.scene.mjs --duration 4 --warmup 1.5 --width 1920 --height 1080 --out artifacts/heavy-atoms-1080p.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-quanta-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
