name: Agent Campus - cinematic supersampled WebGPU MP4
on:
  push:
    branches: [main]
    paths:
      - 'src/observability/campus.ts'
      - 'tools/agent-office/campus*'
      - 'tools/agent-office/render-on-worker.mjs'
      - 'examples/agent-office/campus-replay.json'
      - 'test/agent-campus.test.mjs'
      - '.github/workflows/agent-campus.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-campus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campus-video:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Render on our GPU worker (same entrypoint as direct execution)
        run: node tools/agent-office/render-on-worker.mjs
      - name: Upload real MP4 and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-campus-video-${{ github.sha }}
          path: |
            artifacts/agent-campus/*.mp4
            artifacts/agent-campus/*.png
            artifacts/agent-campus/*.json
          if-no-files-found: warn
          retention-days: 1
