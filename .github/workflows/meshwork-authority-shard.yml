name: Meshwork authority shard

on:
  push:
    branches: [feat/meshwork-authority-shard]
    paths:
      - 'src/network/**'
      - 'test/authority-shard.test.mjs'
      - 'test/network-projection.test.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/meshwork-authority-shard.yml'
  pull_request:
    paths:
      - 'src/network/**'
      - 'test/authority-shard.test.mjs'
      - 'test/network-projection.test.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/meshwork-authority-shard.yml'

permissions:
  contents: read

concurrency:
  group: meshwork-authority-shard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/authority-shard.test.mjs test/network-projection.test.mjs
