name: NPC Speech Intelligibility
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/**'
      - 'src/animation/soft-mouth.ts'
      - 'src/animation/soft-tongue.ts'
      - 'tools/npc-speech-demo/**'
      - 'test/npc-speech.test.mjs'
      - 'test/airway-geometry.test.mjs'
      - '.github/workflows/npc-speech-intelligibility.yml'
  workflow_dispatch:

concurrency:
  group: npc-speech-intelligibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/airway-geometry.test.mjs test/npc-speech.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip python3-venv
      - name: Generate physical NPC audio
        run: node tools/npc-speech-demo/generate-audio.mjs
      - name: Dump vowel airway profiles
        run: node tools/npc-speech-demo/airway-dump.mjs
      - name: Generate English ASR probe clips
        run: node tools/npc-speech-demo/english-probe.mjs
      - name: Prepare offline English recognizer
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check vosk==0.3.45
          mkdir -p .cache/vosk
          curl -fL --retry 3 --retry-delay 2             https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip             -o .cache/vosk/model.zip
          unzip -q -o .cache/vosk/model.zip -d .cache/vosk
      - name: Probe simple English words
        run: |
          mkdir -p artifacts/npc-speech/probe/asr
          for word in yeah mama me mom yeah-mama; do
            ffmpeg -y -hide_banner -loglevel error -i artifacts/npc-speech/probe/$word.wav -ac 1 -ar 16000 -sample_fmt s16 artifacts/npc-speech/probe/asr/$word.wav
          done
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py artifacts/npc-speech/probe/asr/yeah.wav .cache/vosk/vosk-model-small-en-us-0.15 "yeah" 2.0 artifacts/npc-speech/probe/yeah-asr.json
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py artifacts/npc-speech/probe/asr/mama.wav .cache/vosk/vosk-model-small-en-us-0.15 "mama" 2.0 artifacts/npc-speech/probe/mama-asr.json
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py artifacts/npc-speech/probe/asr/me.wav .cache/vosk/vosk-model-small-en-us-0.15 "me" 2.0 artifacts/npc-speech/probe/me-asr.json
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py artifacts/npc-speech/probe/asr/mom.wav .cache/vosk/vosk-model-small-en-us-0.15 "mom" 2.0 artifacts/npc-speech/probe/mom-asr.json
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py artifacts/npc-speech/probe/asr/yeah-mama.wav .cache/vosk/vosk-model-small-en-us-0.15 "yeah mama" 2.0 artifacts/npc-speech/probe/yeah-mama-asr.json
      - name: Convert both physical speech paths for ASR
        run: |
          ffmpeg -y -hide_banner -loglevel error -i artifacts/npc-speech/npc-english-soft.wav -ac 1 -ar 16000 -sample_fmt s16 artifacts/npc-speech/asr-soft.wav
          ffmpeg -y -hide_banner -loglevel error -i artifacts/npc-speech/npc-english-waveguide.wav -ac 1 -ar 16000 -sample_fmt s16 artifacts/npc-speech/asr-waveguide.wav
      - name: Recognize soft-geometry path
        continue-on-error: true
        run: |
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py \
            artifacts/npc-speech/asr-soft.wav \
            .cache/vosk/vosk-model-small-en-us-0.15 \
            "I am alive" \
            0.34 \
            artifacts/npc-speech/asr-soft.json
      - name: Gate intelligible physical NPC path
        run: |
          .venv/bin/python tools/npc-speech-demo/vosk-intelligibility.py \
            artifacts/npc-speech/asr-waveguide.wav \
            .cache/vosk/vosk-model-small-en-us-0.15 \
            "I am alive" \
            0.34 \
            artifacts/npc-speech/asr-waveguide.json
            artifacts/npc-speech/probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-english-physical-speech
          path: |
            artifacts/npc-speech/npc-russian-geometry-speech.mp4
            artifacts/npc-speech/npc-english-soft.wav
            artifacts/npc-speech/npc-english-waveguide.wav
            artifacts/npc-speech/poster.png
            artifacts/npc-speech/evidence.json
            artifacts/npc-speech/audio-evidence.json
            artifacts/npc-speech/airway-vowels.json
            artifacts/npc-speech/asr-soft.json
            artifacts/npc-speech/asr-waveguide.json
          retention-days: 14
