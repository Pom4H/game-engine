name: Physical Dialogue Face
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/vocal-source.ts'
      - 'src/audio/vocal-tract.ts'
      - 'src/audio/dialogue-vocal.ts'
      - 'src/animation/vocal-face.ts'
      - 'tools/vocal-face-demo/capture-dialogue-cpu.mjs'
      - 'test/dialogue-vocal.test.mjs'
      - '.github/workflows/physical-dialogue-face.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/vocal-source.test.mjs test/vocal-tract.test.mjs test/dialogue-vocal.test.mjs test/vocal-face.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/vocal-face-demo/capture-dialogue-cpu.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: physical-dialogue-face-mp4
          path: |
            artifacts/physical-dialogue/two-people-funny-dialogue.mp4
            artifacts/physical-dialogue/poster.png
            artifacts/physical-dialogue/evidence.json
          retention-days: 14
