name: NPC VTL Production Speech
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/vtl-external.ts'
      - 'src/index.ts'
      - 'test/npc-speech.test.mjs'
      - 'tools/npc-speech-demo/vtl-production-plan.mjs'
      - 'tools/npc-speech-demo/vtl-oracle.py'
      - 'tools/npc-speech-demo/vtl-dialogue-plan.mjs'
      - 'tools/npc-speech-demo/vtl-dialogue.py'
      - 'tools/npc-speech-demo/vtl-anatomy-reference.patch'
      - 'test/vtl-dialogue.test.mjs'
      - 'tools/npc-speech-demo/whisper-intelligibility.py'
      - '.github/workflows/npc-vtl-production.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/npc-speech.test.mjs test/vtl-dialogue.test.mjs
      - name: Generate engine-owned VTL plan
        run: node tools/npc-speech-demo/vtl-production-plan.mjs
      - name: Build pinned official VocalTractLab backend
        run: |
          git clone https://github.com/TUD-STKS/VocalTractLabBackend-dev.git /tmp/vtl
          git -C /tmp/vtl checkout df30392f18dc5e175b577c3ba734caaa65a3927f
          git -C /tmp/vtl apply "$GITHUB_WORKSPACE/tools/npc-speech-demo/vtl-anatomy-reference.patch"
          cmake -S /tmp/vtl -B /tmp/vtl/out -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/vtl/out --config Release --target VocalTractLabApi -j2
      - name: Render with official VTL C API
        run: |
          LIB=$(find /tmp/vtl/lib -type f \( -name 'libVocalTractLabApi.so' -o -name 'VocalTractLabApi.so' \) | head -1)
          test -n "$LIB"
          python3 tools/npc-speech-demo/vtl-oracle.py \
            "$LIB" \
            /tmp/vtl/resources/JD3.speaker \
            artifacts/npc-vtl-production/la-la.seg \
            artifacts/npc-vtl-production/la-la.wav
      - name: Render two-speaker dialogue from engine motor and prosody plan
        run: |
          node tools/npc-speech-demo/vtl-dialogue-plan.mjs
          LIB=$(find /tmp/vtl/lib -type f \( -name 'libVocalTractLabApi.so' -o -name 'VocalTractLabApi.so' \) | head -1)
          test -n "$LIB"
          python3 tools/npc-speech-demo/vtl-dialogue.py \
            "$LIB" /tmp/vtl/resources/JD3.speaker \
            artifacts/vtl-dialogue/plan.json artifacts/vtl-dialogue
      - name: Prepare Whisper oracle
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check faster-whisper==1.2.0 requests numpy
          ffmpeg -y -hide_banner -loglevel error \
            -i artifacts/vtl-dialogue/dialogue.wav \
            -ac 1 -ar 16000 -sample_fmt s16 \
            artifacts/vtl-dialogue/dialogue-asr.wav
      - name: Preserve the previously accepted calibration waveform
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          # Independent baseline: successful main@236fd2a6, run 37227580723.
          # Tiny ASR now inserts a third syllable into these exact same bytes;
          # test the waveform exactly here, and real dialogue intelligibility below.
          expected='37f17580b3e7689a7cca5c30c911d7bc1fcf2646498ef23e995aa3cf791c90ba'
          root=pathlib.Path('artifacts/npc-vtl-production')
          actual=hashlib.sha256((root/'la-la.wav').read_bytes()).hexdigest()
          proof={'baselineRun':37227580723,'expectedSha256':expected,'actualSha256':actual,'exactMatch':actual==expected}
          (root/'calibration-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof))
          if actual!=expected: raise SystemExit('VTL calibration waveform changed')
          PYCODE
      - name: Check the complete conversation with an unprompted recognizer
        env:
          WHISPER_MODEL: small.en
        run: |
          dialogue_expected=$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("artifacts/vtl-dialogue/plan.json","utf8")); console.log(p.turns.map(t=>t.text).join(" "));')
          .venv/bin/python tools/npc-speech-demo/whisper-intelligibility.py \
            artifacts/vtl-dialogue/dialogue-asr.wav \
            "$dialogue_expected" 0.15 artifacts/vtl-dialogue/asr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-vtl-production-speech
          path: |
            artifacts/npc-vtl-production/la-la.wav
            artifacts/npc-vtl-production/la-la.seg
            artifacts/npc-vtl-production/la-la.ges
            artifacts/npc-vtl-production/backend.json
            artifacts/npc-vtl-production/calibration-proof.json
            artifacts/vtl-dialogue/
          retention-days: 14
