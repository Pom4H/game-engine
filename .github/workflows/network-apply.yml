name: Network integration verification
on:
  push:
    branches: [codex/network-projections]
permissions:
  contents: write
concurrency:
  group: network-integration-once
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/network-projections
      - name: Apply checked integration; remove this one-time writer
        shell: cmd
        run: |
          node .github/apply-network-integration.mjs
          if errorlevel 1 exit /b 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src tools .github
          git commit -m "feat(network): integrate projection-only presentation and local authority editor"
          if errorlevel 1 exit /b 1
          git push origin HEAD:codex/network-projections
          if errorlevel 1 exit /b 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: npm install --prefix tools/docs --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        shell: cmd
        run: bun run typecheck && bun run build
      - name: Network, HTTP clients and existing DSL tests
        shell: cmd
        run: node --test test/network-projection.test.mjs test/network-host.mjs test/dsl-playground.mjs
      - name: Same-byte publication measurement
        run: node tools/network-harness.mjs
      - run: node tools/docs/build.mjs
      - name: Locate native Chrome
        shell: powershell
        run: |
          $chrome="$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {throw "Native Chrome required"}
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Server pause, replay, two-way editor and airborne rendering
        run: node tools/docs/network-qa.mjs
      - name: Full regression log
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/network | Out-Null
          node --test test/*.test.mjs *> artifacts/network/regression.log
          $result=$LASTEXITCODE
          Get-Content artifacts/network/regression.log | Select-Object -Last 15
          exit $result
      - name: Exact tested source
        if: always()
        shell: cmd
        run: |
          git rev-parse HEAD > artifacts/network/commit.txt
          git archive --format=tar.gz -o artifacts/network/source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-projection-evidence
          path: artifacts/network/
          retention-days: 14
          if-no-files-found: warn
