name: Deploy Game Engine Pages
on:
  workflow_dispatch:
  push:
    branches: [main, render/winter-quality-recovery]
    paths:
      - .github/workflows/pages.yml
      - tools/look-dev/**
      - tools/build-pages.ts
      - test/look-dev.test.mjs
permissions:
  contents: write
  pages: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test test/look-dev.test.mjs
      - run: bun tools/build-pages.ts
      - name: Check live controls on the real WebGPU renderer
        run: node tools/look-dev/smoke.mjs
      - name: Publish verified app without Actions artifact storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/look-dev/publish.mjs
