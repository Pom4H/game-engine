name: Deploy Game Engine Pages
on:
  workflow_dispatch:
  push:
    branches: [main, render/winter-quality-recovery]
    paths:
      - .github/workflows/pages.yml
      - tools/look-dev/**
      - tools/build-pages.ts
      - test/look-dev.test.mjs
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test test/look-dev.test.mjs
      - run: bun tools/build-pages.ts
      - name: Check live controls on the real WebGPU renderer
        run: node tools/look-dev/smoke.mjs
      - uses: actions/configure-pages@v5
      - name: Expose Git Bash and tar
        run: |
          echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          echo C:\Program Files\Git\usr\bin>>%GITHUB_PATH%
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
