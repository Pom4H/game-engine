name: World compiler (Rust / engine ABI)
on:
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'src/world-ir/couplings.ts'
      - 'test/world-couplings.test.mjs'
      - 'examples/worlds/coupled-glass.world'
      - 'examples/worlds/**'
      - 'tools/world-language/**'
      - 'src/scene/scene.ts'
      - 'src/scene/modules.ts'
      - 'src/scene/system-runtime.ts'
      - 'src/scene/performance.ts'
      - 'src/scene/validate.ts'
      - 'src/scene/world-binary.ts'
      - 'src/scene/url.ts'
      - 'src/browser.ts'
      - 'src/index.ts'
      - 'test/world-compiler.test.mjs'
      - 'test/world-direct-execution.test.mjs'
      - 'test/scene-performance.test.mjs'
      - 'package.json'
      - '.github/workflows/world-compiler.yml'
  pull_request:
    paths:
      - 'compiler/**'
      - 'examples/worlds/**'
      - 'tools/world-language/**'
      - 'src/scene/scene.ts'
      - 'src/scene/modules.ts'
      - 'src/scene/system-runtime.ts'
      - 'src/scene/performance.ts'
      - 'src/scene/validate.ts'
      - 'src/scene/world-binary.ts'
      - 'src/scene/url.ts'
      - 'src/browser.ts'
      - 'src/index.ts'
      - 'test/world-compiler.test.mjs'
      - 'test/world-direct-execution.test.mjs'
      - 'test/scene-performance.test.mjs'
      - 'package.json'
      - '.github/workflows/world-compiler.yml'
      - "src/world-ir/couplings.ts"
      - "test/world-couplings.test.mjs"
      - "examples/worlds/coupled-glass.world"
# Keep only the newest automatic verification for each ref.
concurrency:
  group: world-compiler-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  compile-and-integrate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: cargo --version && cargo test --manifest-path compiler/Cargo.toml
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run tsc -p tools/world-language/tsconfig.json
      - run: node --test test/world-compiler.test.mjs test/world-couplings.test.mjs test/world-direct-execution.test.mjs test/scene-performance.test.mjs
      - run: bun tools/world-language/benchmark.ts
      - run: node tools/world-language/profile.mjs examples/worlds/array.world 240 direct
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: world-language-benchmark
          path: |
            artifacts/world-language-benchmark.json
            artifacts/world-performance-report.json
