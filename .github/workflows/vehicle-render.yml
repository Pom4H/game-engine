name: Vehicle renders

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/promo/**'
      - 'tools/render-harness.mjs'
      - '.github/workflows/vehicle-render.yml'
  workflow_dispatch:

concurrency:
  group: vehicle-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locate Chrome
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\chromium.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { $chrome = (Get-Command chromium.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw "Chrome/Chromium not found" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Render M3
        run: node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/promo/render-views.mjs 1280 720
      - name: Render pickup
        run: node tools/render-harness.mjs tools/promo/pickup-day.scene.mjs tools/promo/pickup-views.mjs 1280 720
      - uses: actions/upload-artifact@v7
        with:
          name: vehicle-renders
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
