name: Integrate reviewed face lab
on:
  push:
    branches: [codex/native-speech-tea-performance]
    paths: ['.github/integrate-face-lab.py', '.github/workflows/face-lab-integrate.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/native-speech-tea-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Materialize exact reviewed edits and pinned CC0 asset
        run: |
          python3 .github/integrate-face-lab.py
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj -o /tmp/face-reference.obj
          test "$(git hash-object /tmp/face-reference.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          python3 -m pip install numpy==2.3.5 scipy==1.17.0
          python3 tools/face-lab/build-reference.py /tmp/face-reference.obj src/assets/face-reference.ts
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/makehumancommunity/makehuman/master/LICENSE.ASSETS.md -o licenses/face-reference-CC0.txt
      - name: Build and focused contracts before publication
        run: |
          bun install --frozen-lockfile
          bun run typecheck && bun run build
          node --test test/face-surface.test.mjs test/mesh-stream-render.test.mjs test/speech-lab.test.mjs test/tea-performance.test.mjs test/conversation-face.test.mjs test/tea-scene.test.mjs test/native-speech.test.mjs test/native-tract-energy.test.mjs
      - name: Publish only reviewed source files to the experimental branch
        id: publish
        run: |
          git config user.name 'game-engine-lab[bot]'
          git config user.email 'game-engine-lab@users.noreply.github.com'
          git add src/procedural/mesh.ts src/audio/native-speech.ts src/render/webgpu.ts tools/tea-performance/stage.mjs tools/tea-performance/scene.mjs tools/tea-performance/README.md test/tea-performance.test.mjs tools/tea-scene/server.mjs tools/tea-scene/webgpu-capture.mjs src/assets/face-reference.ts licenses/face-reference-CC0.txt
          git commit -m 'feat: integrate tested continuous facial surface and fixed speech diagnostics'
          git push origin HEAD:refs/heads/codex/native-speech-tea-performance
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  inspect:
    needs: apply
    uses: ./.github/workflows/speech-face-lab.yml
    with:
      source_ref: ${{ needs.apply.outputs.commit }}
