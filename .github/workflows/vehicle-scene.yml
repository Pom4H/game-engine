name: Vehicle scene
on:
  push:
    branches: [codex/vehicle-causal-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vehicle-scene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.contracts.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      - id: contracts
        name: Physical and projection contracts
        run: node --test test/vehicle-runtime.test.mjs test/vehicle-scene.test.mjs
      - run: node tools/vehicle-scene-harness.mjs
      - name: Full regressions (failures stay failures)
        run: |
          mkdir -p artifacts/vehicle-scene
          node --test test/*.test.mjs > artifacts/vehicle-scene/regressions.log 2>&1
      - name: Reproducible source
        if: always()
        run: |
          mkdir -p artifacts/vehicle-scene
          git rev-parse HEAD > artifacts/vehicle-scene/commit.txt
          tar -czf artifacts/vehicle-scene/source-runtime.tar.gz src dist test tools docs package.json tsconfig.json tsconfig.build.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vehicle-scene-evidence
          path: artifacts/vehicle-scene/
          if-no-files-found: error
          retention-days: 14
  render:
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.ready == 'success' }}
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: vehicle-scene-evidence
          path: artifacts/vehicle-scene/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Locate native Chrome
        shell: powershell
        run: |
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: node tools/vehicle-scene-render.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vehicle-scene-native-renders
          path: |
            artifacts/vehicle-scene/*.png
            artifacts/vehicle-scene/*.render.json
            artifacts/vehicle-scene/commit.txt
          if-no-files-found: error
          retention-days: 14
