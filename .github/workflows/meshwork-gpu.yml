name: Meshwork GPU conformance

on:
  push:
    branches: [main]
    paths:
      - 'src/render-ir/**'
      - 'src/execution/**'
      - 'src/meshwork/**'
      - 'tools/meshwork/**'
      - 'tools/promo/capture.mjs'
      - 'tools/render-harness.mjs'
      - 'test/meshwork-*.test.mjs'
      - '.github/workflows/meshwork-gpu.yml'
  workflow_dispatch:

concurrency:
  group: meshwork-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test test/meshwork-boundaries.test.mjs test/meshwork-temporal.test.mjs
      - name: Locate hardware Chrome
        run: |
          $candidates = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe", "$env:ProgramFiles\Chromium\Application\chrome.exe")
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw 'Chrome not found on GPU worker' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Benchmark real WebGPU local path
        env:
          RENDER_REQUIRE_HARDWARE: '1'
          RENDER_PROFILING: '1'
          RENDER_WARMUP_FRAMES: '120'
          MESHWORK_WORKER_SLOT: 'conformance'
        run: |
          $env:MESHWORK_BENCH_STARTED_MS=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/meshwork/bench.views.mjs 1920 1080
          node tools/meshwork/calibrate.mjs artifacts/render-hud.json
      - name: Upload hardware calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshwork-gpu-calibration
          path: |
            artifacts/meshwork/calibration.json
            artifacts/meshwork/worker.png
            artifacts/render-hud.json
          retention-days: 14
      - name: Capture continuous reference
        run: |
          New-Item -ItemType Directory -Force artifacts/meshwork-consistency | Out-Null
          $env:PROMO_CAPTURE_FPS='30'
          $env:PROMO_FRAME_START='0'
          $env:PROMO_FRAME_COUNT='120'
          $env:PROMO_WARMUP_FRAMES='0'
          $env:PROMO_OUTPUT_NAME='reference.mp4'
          node tools/promo/capture.mjs m3
      - name: Capture isolated temporal segments
        run: |
          $env:PROMO_CAPTURE_FPS='30'
          $env:PROMO_FRAME_COUNT='30'
          $env:PROMO_WARMUP_FRAMES='12'
          foreach ($i in 0..3) {
            $env:PROMO_FRAME_START=[string]($i*30)
            if ($i -eq 0) { $env:PROMO_WARMUP_FRAMES='0' } else { $env:PROMO_WARMUP_FRAMES='12' }
            $env:PROMO_OUTPUT_NAME="segment-$i.mp4"
            node tools/promo/capture.mjs m3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Assemble visual consistency proof
        run: |
          $out='artifacts/meshwork-consistency'
          Copy-Item artifacts/promo-v3/reference.mp4 "$out/reference.mp4" -Force
          @"
          ffconcat version 1.0
          file '../promo-v3/segment-0.mp4'
          file '../promo-v3/segment-1.mp4'
          file '../promo-v3/segment-2.mp4'
          file '../promo-v3/segment-3.mp4'
          "@ | Set-Content "$out/segments.ffconcat" -Encoding ascii
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i "$out/segments.ffconcat" -c copy "$out/mesh-segmented.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $filter="[0:v]scale=960:540[left];[1:v]scale=960:540,drawbox=x=0:y=0:w=iw:h=10:color=red@0.95:t=fill:enable='between(n,29,32)+between(n,59,62)+between(n,89,92)'[right];[left][right]hstack=inputs=2[v]"
          ffmpeg -y -hide_banner -loglevel error -i "$out/reference.mp4" -i "$out/mesh-segmented.mp4" -filter_complex $filter -map "[v]" -an -c:v mpeg4 -q:v 2 -pix_fmt yuv420p -movflags +faststart "$out/meshwork-consistency.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ssim=Start-Process -FilePath ffmpeg -ArgumentList @('-hide_banner','-i',"$out/reference.mp4",'-i',"$out/mesh-segmented.mp4",'-lavfi',"ssim=stats_file=$out/ssim.log",'-f','null','-') -NoNewWindow -Wait -PassThru -RedirectStandardError "$out/ssim-summary.txt"
          if ($ssim.ExitCode -ne 0) { exit $ssim.ExitCode }
          $evidence=[ordered]@{
            commit=$env:GITHUB_SHA
            runner=$env:RUNNER_NAME
            fps=30
            frames=120
            segmentFrames=30
            warmupFrames=12
            boundaries=@(30,60,90)
            left='continuous single-renderer reference'
            right='four isolated renderer sessions stitched as temporal Meshwork segments'
            redBar='worker boundary marker on mesh side'
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content "$out/evidence.json" -Encoding utf8
          Get-Item "$out/meshwork-consistency.mp4" | Format-List Name,Length
      - name: Upload visual consistency video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshwork-visual-consistency
          path: |
            artifacts/meshwork-consistency/meshwork-consistency.mp4
            artifacts/meshwork-consistency/reference.mp4
            artifacts/meshwork-consistency/mesh-segmented.mp4
            artifacts/meshwork-consistency/evidence.json
            artifacts/meshwork-consistency/ssim.log
            artifacts/meshwork-consistency/ssim-summary.txt
          retention-days: 14

  visual-mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Locate Chrome and ffmpeg
        shell: bash
        run: |
          chrome=""
          for candidate in             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"             "/Applications/Chromium.app/Contents/MacOS/Chromium"; do
            if [ -x "$candidate" ]; then chrome="$candidate"; break; fi
          done
          if [ -z "$chrome" ]; then
            chrome="$(command -v google-chrome || command -v chromium || true)"
          fi
          if [ -z "$chrome" ]; then echo "Chrome/Chromium not found"; exit 1; fi
          command -v ffmpeg >/dev/null
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Capture continuous reference
        shell: bash
        run: |
          mkdir -p artifacts/meshwork-consistency-mac
          export PROMO_CAPTURE_FPS=30
          export PROMO_FRAME_START=0
          export PROMO_FRAME_COUNT=120
          export PROMO_WARMUP_FRAMES=0
          export PROMO_OUTPUT_NAME=reference.mp4
          node tools/promo/capture.mjs m3
      - name: Capture isolated temporal segments
        shell: bash
        run: |
          export PROMO_CAPTURE_FPS=30
          export PROMO_FRAME_COUNT=30
          for i in 0 1 2 3; do
            export PROMO_FRAME_START=$((i*30))
            if [ "$i" -eq 0 ]; then export PROMO_WARMUP_FRAMES=0; else export PROMO_WARMUP_FRAMES=12; fi
            export PROMO_OUTPUT_NAME="segment-$i.mp4"
            node tools/promo/capture.mjs m3
          done
      - name: Assemble visual consistency proof
        shell: bash
        run: |
          out="artifacts/meshwork-consistency-mac"
          cp artifacts/promo-v3/reference.mp4 "$out/reference.mp4"
          cat > "$out/segments.ffconcat" <<'EOF'
          ffconcat version 1.0
          file '../promo-v3/segment-0.mp4'
          file '../promo-v3/segment-1.mp4'
          file '../promo-v3/segment-2.mp4'
          file '../promo-v3/segment-3.mp4'
          EOF
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i "$out/segments.ffconcat" -c copy "$out/mesh-segmented.mp4"
          filter="[0:v]scale=960:540[left];[1:v]scale=960:540,drawbox=x=0:y=0:w=iw:h=10:color=red@0.95:t=fill:enable='between(n,29,32)+between(n,59,62)+between(n,89,92)'[right];[left][right]hstack=inputs=2[v]"
          ffmpeg -y -hide_banner -loglevel error -i "$out/reference.mp4" -i "$out/mesh-segmented.mp4" -filter_complex "$filter" -map "[v]" -an -c:v mpeg4 -q:v 2 -pix_fmt yuv420p -movflags +faststart "$out/meshwork-consistency.mp4"
          ffmpeg -hide_banner -i "$out/reference.mp4" -i "$out/mesh-segmented.mp4" -lavfi "ssim=stats_file=$out/ssim.log" -f null - 2> "$out/ssim-summary.txt"
          cat > "$out/evidence.json" <<EOF
          {
            "commit":"$GITHUB_SHA",
            "runner":"$RUNNER_NAME",
            "fps":30,
            "frames":120,
            "segmentFrames":30,
            "warmupFrames":12,
            "boundaries":[30,60,90],
            "left":"continuous single-renderer reference",
            "right":"four isolated renderer sessions stitched as temporal Meshwork segments",
            "redBar":"worker boundary marker on mesh side"
          }
          EOF
          ls -lh "$out/meshwork-consistency.mp4"
      - name: Upload macOS visual consistency video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshwork-visual-consistency-mac
          path: |
            artifacts/meshwork-consistency-mac/meshwork-consistency.mp4
            artifacts/meshwork-consistency-mac/reference.mp4
            artifacts/meshwork-consistency-mac/mesh-segmented.mp4
            artifacts/meshwork-consistency-mac/evidence.json
            artifacts/meshwork-consistency-mac/ssim.log
            artifacts/meshwork-consistency-mac/ssim-summary.txt
          retention-days: 14
