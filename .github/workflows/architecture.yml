name: Engine architecture
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/browser.ts'
      - 'src/render/webgpu.ts'
      - 'src/render/cpu.ts'
      - 'src/render/types.ts'
      - 'src/render/frame.ts'
      - 'src/render-ir/**'
      - 'src/content/**'
      - 'src/storage/**'
      - 'src/execution/**'
      - 'src/meshwork/**'
      - 'test/meshwork-boundaries.test.mjs'
      - 'test/causal-render-contract.test.mjs'
      - 'test/causal-storage.test.mjs'
      - 'test/meshwork-temporal.test.mjs'
      - 'test/meshwork-execution.test.mjs'
      - 'test/meshwork-spine.test.mjs'
      - 'test/meshwork-coordinator.test.mjs'
      - 'package.json'
      - 'src/runtime/browser.ts'
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/scene/modules.ts'
      - 'src/scene/system-runtime.ts'
      - 'src/render/depth.ts'
      - 'src/audio/depth.ts'
      - 'src/network/**'
      - 'src/world/depth.ts'
      - 'test/kernel-depth.test.mjs'
      - 'test/depth-families.test.mjs'
      - 'test/authority-ledger.test.mjs'
      - '.github/workflows/architecture.yml'
  pull_request:
    paths:
      - 'src/audio/browser.ts'
      - 'src/render/webgpu.ts'
      - 'src/render/cpu.ts'
      - 'src/render/types.ts'
      - 'src/render/frame.ts'
      - 'src/render-ir/**'
      - 'src/content/**'
      - 'src/storage/**'
      - 'src/execution/**'
      - 'src/meshwork/**'
      - 'test/meshwork-boundaries.test.mjs'
      - 'test/causal-render-contract.test.mjs'
      - 'test/causal-storage.test.mjs'
      - 'test/meshwork-temporal.test.mjs'
      - 'test/meshwork-execution.test.mjs'
      - 'test/meshwork-spine.test.mjs'
      - 'test/meshwork-coordinator.test.mjs'
      - 'package.json'
      - 'src/runtime/browser.ts'
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/scene/modules.ts'
      - 'src/scene/system-runtime.ts'
      - 'src/render/depth.ts'
      - 'src/audio/depth.ts'
      - 'src/network/**'
      - 'src/world/depth.ts'
      - 'test/kernel-depth.test.mjs'
      - 'test/depth-families.test.mjs'
      - 'test/authority-ledger.test.mjs'
      - '.github/workflows/architecture.yml'
concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/kernel-depth.test.mjs test/depth-families.test.mjs test/causal-render-contract.test.mjs test/causal-storage.test.mjs test/authority-ledger.test.mjs test/meshwork-boundaries.test.mjs test/meshwork-temporal.test.mjs test/meshwork-execution.test.mjs test/meshwork-spine.test.mjs test/meshwork-coordinator.test.mjs
