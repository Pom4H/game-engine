name: Snowy Arcade GPU
on:
  push:
    branches: [render/snowy-arcade]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snowy-arcade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare immutable source blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/arcade/prepare-upgrade.mjs
