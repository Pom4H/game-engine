name: Snowy Arcade GPU
on:
  push:
    branches: [main]
    paths:
      - 'src/scene/**'
      - 'tools/arcade/**'
      - 'test/arcade-motion-light.test.mjs'
      - 'test/height-fog.test.mjs'
      - 'test/label-color.test.mjs'
      - 'test/snowy-arcade.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
# GPU evidence is intentionally serialized; proving-ground owns the physics release camera gate.
concurrency:
  group: snowy-arcade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locate hardware Chrome
        run: |
          $candidates = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe", "$env:ProgramFiles\Chromium\Application\chrome.exe")
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw 'Chrome not found on GPU worker' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Render and validate actual WebGPU frames
        id: frames
        run: node tools/arcade/capture.mjs
      - name: Full regression suite
        if: always()
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          bun run test > artifacts/unit-tests.log 2>&1
          set TEST_EXIT=%errorlevel%
          powershell -NoProfile -Command "Get-Content artifacts/unit-tests.log -Tail 20"
          exit /b %TEST_EXIT%
      - name: Preserve full-resolution frames locally
        if: always() && steps.frames.outcome == 'success'
        run: |
          $target = Join-Path $env:USERPROFILE 'game-engine-renders\snowy-arcade-fidelity'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item artifacts/snowy-arcade*.png,artifacts/arcade-preview.jpg,artifacts/arcade-evidence.json $target -Force
      - name: Publish private render evidence
        if: always() && steps.frames.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'snowy-arcade-' + $env:GITHUB_SHA.Substring(0,7)
          node tools/publish-release.mjs $tag artifacts/snowy-arcade.png artifacts/snowy-arcade-motion.png artifacts/arcade-preview.jpg artifacts/arcade-evidence.json artifacts/unit-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/arcade/publish-review.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
