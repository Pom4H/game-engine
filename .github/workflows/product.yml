name: Product
on:
  push:
    branches: [product/unified-engine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export compact source delta for offline integration
        shell: powershell
        run: |
          @'
          const {execFileSync}=require('node:child_process');
          const {gzipSync}=require('node:zlib');
          const base='6bfb8c51228c99dad1cc91c647194a0643c5bb8a';
          for(const ref of ['HEAD','origin/main','origin/refactor/causal-runtime']){
            const git=(...a)=>execFileSync('git',a,{encoding:'utf8',maxBuffer:20*1024*1024});
            const names=git('diff','--name-only',base,ref,'--','src','tools','test','docs','package.json','README.md').trim().split('\n').filter(Boolean);
            const files={};for(const name of names){try{files[name]=git('show',ref+':'+name);}catch{files[name]=null;}}
            const data=Buffer.from(gzipSync(JSON.stringify({base,ref,commit:git('rev-parse',ref).trim(),files}))).toString('base64');
            console.log('SOURCE_DELTA '+ref+' '+data.length);
            for(let i=0;i<data.length;i+=6000)console.log('DELTA '+ref+' '+i+' '+data.slice(i,i+6000));
          }
          '@ | node
          exit $LASTEXITCODE
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned engine tooling
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        shell: powershell
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          exit $LASTEXITCODE
      - name: Complete regression suite
        shell: powershell
        run: |
          node --test test/*.test.mjs
          exit $LASTEXITCODE
