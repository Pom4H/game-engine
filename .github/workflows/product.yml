name: Product
on:
  push:
    branches: [product/unified-engine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compact integration patch
        shell: powershell
        run: |
          @'
          const {execFileSync}=require('node:child_process');
          const {gzipSync}=require('node:zlib');
          const patch=execFileSync('git',['diff','--binary','6bfb8c51228c99dad1cc91c647194a0643c5bb8a','2db7720705c87c70ebc3572e7f7956abdfe0e0b0','--','src','tools','test','package.json','README.md'],{maxBuffer:10*1024*1024});
          const data=gzipSync(patch).toString('base64');
          console.log('PATCH_BYTES '+patch.length+' BASE64 '+data.length);
          console.log('PATCH '+data);
          '@ | node
          exit $LASTEXITCODE
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned engine tooling
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        shell: powershell
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          exit $LASTEXITCODE
      - name: Complete regression suite
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/product | Out-Null
          cmd /c "node --test test/*.test.mjs > artifacts/product/tests.log 2>&1"
          $result = $LASTEXITCODE
          Get-Content artifacts/product/tests.log -Tail 20
          Select-String -Path artifacts/product/tests.log -Pattern '^not ok' | ForEach-Object { $_.Line }
          exit $result
