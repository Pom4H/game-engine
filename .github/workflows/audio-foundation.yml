name: Audio foundation
on:
  push:
    paths:
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/audio/**'
      - 'src/animation/soft-mouth.ts'
      - 'src/animation/soft-tongue.ts'
      - 'tools/acoustic-demo.mjs'
      - 'tools/car-garage-audio-demo.mjs'
      - 'tools/vocal-tract-demo.mjs'
      - 'test/vocal-tract.test.mjs'
      - 'test/vocal-face.test.mjs'
      - 'test/vocal-source.test.mjs'
      - 'test/airway-geometry.test.mjs'
      - 'test/acoustic-transfer.test.mjs'
      - 'src/scene/acoustic-boundary.ts'
      - 'src/physics/wave-field.ts'
      - 'src/scene/events.ts'
      - 'test/audio-foundation.test.mjs'
      - 'test/browser-audio.test.mjs'
      - 'docs/AUDIO_FOUNDATION.md'
      - '.github/workflows/audio-foundation.yml'
  pull_request:
    paths:
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/audio/**'
      - 'src/animation/soft-mouth.ts'
      - 'src/animation/soft-tongue.ts'
      - 'src/scene/events.ts'
      - 'test/audio-foundation.test.mjs'
      - 'docs/AUDIO_FOUNDATION.md'
      - '.github/workflows/audio-foundation.yml'

concurrency:
  group: audio-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/audio-foundation.test.mjs test/acoustic-transfer.test.mjs test/browser-audio.test.mjs test/vocal-source.test.mjs test/airway-geometry.test.mjs test/vocal-tract.test.mjs test/vocal-face.test.mjs test/kernel-depth.test.mjs
      - run: node tools/acoustic-demo.mjs
      - run: node tools/car-garage-audio-demo.mjs
      - run: node tools/vocal-tract-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: acoustic-door-demo
          path: artifacts/acoustic-demo
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: car-garage-audio-demo
          path: artifacts/car-garage-audio
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: vocal-tract-demo
          path: artifacts/vocal-tract-demo
          retention-days: 14
