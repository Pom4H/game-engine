name: GPU shader crossover A-B-B-A - self-hosted RDNA3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fps-windows-triple-ab.yml'
      - 'src/render/webgpu.ts'
      - 'src/render/lighting.ts'
      - 'tools/fps/aggregate-gpu-crossover.mjs'
      - 'tools/fps/compare-gpu-images.mjs'
      - 'test/shader-zero-contribution.test.mjs'
  workflow_dispatch:
concurrency:
  group: gpu-shader-triple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      BASELINE_SHA: b45c2d744f847f9750b75a8f2637e214f936981e
      RENDER_PROFILING: '1'
      RENDER_REQUIRE_HARDWARE: '1'
      RENDER_FPS_BENCH_FRAMES: '90'
      RENDER_WARMUP_FRAMES: '12'
      GPU_AB_REQUIRE_TIMESTAMPS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Real WebGPU A-B-B-A and pixel-equivalence test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function CheckNativeExit([string]$step) {
            if ($LASTEXITCODE -ne 0) { throw "$step failed with exit code $LASTEXITCODE" }
          }
          function RunVariant([string]$commit,[string]$label) {
            git -c advice.detachedHead=false checkout -f $commit
            CheckNativeExit "checkout $commit"
            bun install --frozen-lockfile
            CheckNativeExit "install $label"
            bun run build
            CheckNativeExit "build $label"
            $env:RENDER_FPS_BENCH_LABEL=$label
            node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/promo/render-views.mjs 1920 1080
            CheckNativeExit "hardware capture $label"
          }
          # A1: pre-instancing production shader and its original physical scene.
          RunVariant $env:BASELINE_SHA 'a1'
          New-Item -ItemType Directory -Force artifacts/fps/label-ab-baseline | Out-Null
          Copy-Item artifacts/render34.png,artifacts/render35.png,artifacts/render36.png,artifacts/render37.png artifacts/fps/label-ab-baseline/ -Force
          Copy-Item artifacts/fps/gpu-budget-a1.json artifacts/fps/gpu-budget-baseline.json -Force
          # B1: current production renderer with dynamic instancing/lighting improvements.
          RunVariant $env:GITHUB_SHA 'b1'
          node --test test/shader-zero-contribution.test.mjs
          CheckNativeExit 'zero-contribution algebra'
          Copy-Item artifacts/fps/gpu-budget-b1.json artifacts/fps/gpu-budget-optimized.json -Force
          node tools/fps/compare-gpu-images.mjs
          CheckNativeExit 'image equivalence'
          # Reverse the order to control warming and scheduling drift.
          RunVariant $env:GITHUB_SHA 'b2'
          RunVariant $env:BASELINE_SHA 'a2'
          git -c advice.detachedHead=false checkout -f $env:GITHUB_SHA
          CheckNativeExit 'restore candidate'
          node tools/fps/aggregate-gpu-crossover.mjs
          CheckNativeExit 'GPU crossover'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-shader-crossover-rdna3
          path: |
            artifacts/fps/gpu-budget-*.json
            artifacts/fps/shader-ab.json
            artifacts/fps/gpu-crossover.json
            artifacts/fps/label-ab-baseline/*.png
            artifacts/render34.png
            artifacts/render35.png
            artifacts/render36.png
            artifacts/render37.png
