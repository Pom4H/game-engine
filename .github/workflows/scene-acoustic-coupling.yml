name: Emergent acoustic contact and NPC sensing
on:
  push:
    paths:
      - 'src/scene/acoustic-coupling.ts'
      - 'src/scene/acoustic-boundary.ts'
      - 'src/scene/scene.ts'
      - 'src/physics/wave-field.ts'
      - 'src/world-ir/index.ts'
      - 'src/world-ir/couplings.ts'
      - 'src/index.ts'
      - 'src/browser.ts'
      - 'package.json'
      - 'test/scene-acoustic-coupling.test.mjs'
      - 'examples/worlds/physical-hearing.world'
      - 'docs/SCENE_ACOUSTIC_COUPLING.md'
      - '.github/workflows/scene-acoustic-coupling.yml'
  pull_request:
    paths:
      - 'src/scene/acoustic-coupling.ts'
      - 'src/scene/acoustic-boundary.ts'
      - 'src/scene/scene.ts'
      - 'src/physics/wave-field.ts'
      - 'src/world-ir/index.ts'
      - 'test/scene-acoustic-coupling.test.mjs'
      - 'examples/worlds/physical-hearing.world'
      - '.github/workflows/scene-acoustic-coupling.yml'
jobs:
  acoustic-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Native compiler and Rust acoustic kernel
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test --manifest-path compiler/Cargo.toml
          cargo test --manifest-path kernels/world-wave/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path kernels/world-wave/Cargo.toml
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Contact energy, wave front, geometry, real listener, and Rust/WASM parity
        run: node --test test/scene-acoustic-coupling.test.mjs test/world-couplings.test.mjs test/world-interaction-ir.test.mjs test/wave-field.test.mjs test/wave-wasm.test.mjs test/acoustic-transfer.test.mjs test/causal-render-contract.test.mjs test/emergence-rigid-batch.test.mjs
      - name: Full emergent world physics and environmental invariants
        run: node --test test/proving-ground.test.mjs test/shallow-water-basin.test.mjs test/kernel-depth.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-world-rust-wasm
          path: kernels/world-wave/target/wasm32-unknown-unknown/release/world_wave_kernel.wasm
          retention-days: 30
