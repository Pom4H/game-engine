name: Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/render-*.mjs'
      - 'tools/promo/**'
      - '.github/workflows/render.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locate Chrome
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\chromium.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { $chrome = (Get-Command chromium.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw "Chrome/Chromium not found on self-hosted worker" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $chrome"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Render four views
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node tools/render-scene.mjs tools/promo/views/front.scene.mjs 1280 720 artifacts/render-front.png
          node tools/render-scene.mjs tools/promo/views/rear.scene.mjs 1280 720 artifacts/render-rear.png
          node tools/render-scene.mjs tools/promo/views/left.scene.mjs 1280 720 artifacts/render-left.png
          node tools/render-scene.mjs tools/promo/views/right.scene.mjs 1280 720 artifacts/render-right.png
      - name: Validate PNGs
        shell: powershell
        run: |
          Get-ChildItem artifacts/render-*.png | ForEach-Object {
            $b=[IO.File]::ReadAllBytes($_.FullName)
            if($b[0] -ne 137 -or $b[1] -ne 80 -or $b[2] -ne 78 -or $b[3] -ne 71){ throw "Invalid PNG: $($_.Name)" }
            Write-Host "PNG $($_.Name) $($_.Length) bytes"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: game-engine-four-views
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
