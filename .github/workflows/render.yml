name: Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/render-*.mjs'
      - '.github/workflows/render.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Render current engine scene
        run: |
          mkdir -p artifacts
          node tools/render-scene.mjs tools/render-demo.scene.mjs 1280 720 artifacts/render.png
      - name: Validate PNG
        run: |
          node -e "const fs=require('fs'); const b=fs.readFileSync('artifacts/render.png'); if(b.readUInt32BE(0)!==0x89504e47) process.exit(1); console.log('PNG',b.length)"
      - uses: actions/upload-artifact@v7
        with:
          name: game-engine-render
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
