name: Render

on:
  push:
    branches: [main, refactor/causal-runtime]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tsconfig*.json'
      - 'tools/render-*.mjs'
      - 'tools/promo/**'
      - '.github/workflows/render.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  render:
    needs: check
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locate Chrome
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\chromium.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { $chrome = (Get-Command chromium.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw "Chrome/Chromium not found on self-hosted worker" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $chrome"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Render promo views
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/promo/render-views.mjs 1280 720
      - name: Validate PNGs
        shell: powershell
        run: |
          Get-ChildItem artifacts/render*.png | ForEach-Object {
            $b=[IO.File]::ReadAllBytes($_.FullName)
            if($b[0] -ne 137 -or $b[1] -ne 80 -or $b[2] -ne 78 -or $b[3] -ne 71){ throw "Invalid PNG: $($_.Name)" }
            if($_.Length -lt 1000){ throw "Suspiciously small PNG: $($_.Name)" }
            Write-Host "PNG $($_.Name) $($_.Length) bytes"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: game-engine-promo-views
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
