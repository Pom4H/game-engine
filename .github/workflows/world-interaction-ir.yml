name: World Interaction IR causal integration
on:
  push:
    branches: [main]
    paths:
      - 'src/world-ir/**'
      - 'compiler/**'
      - 'examples/worlds/coupled-glass.world'
      - 'test/world-couplings.test.mjs'
      - 'src/scene/scene.ts'
      - 'src/environment/surface-state.ts'
      - 'src/execution/index.ts'
      - 'src/render-ir/index.ts'
      - 'src/index.ts'
      - 'src/browser.ts'
      - 'test/world-interaction-ir.test.mjs'
      - 'test/causal-render-contract.test.mjs'
      - 'docs/WORLD_INTERACTION_IR.md'
      - 'package.json'
      - '.github/workflows/world-interaction-ir.yml'
  pull_request:
    paths:
      - 'src/world-ir/**'
      - 'compiler/**'
      - 'examples/worlds/coupled-glass.world'
      - 'test/world-couplings.test.mjs'
      - 'src/scene/scene.ts'
      - 'src/environment/surface-state.ts'
      - 'src/execution/index.ts'
      - 'src/render-ir/index.ts'
      - 'src/index.ts'
      - 'src/browser.ts'
      - 'test/world-interaction-ir.test.mjs'
      - 'docs/WORLD_INTERACTION_IR.md'
      - 'package.json'
      - '.github/workflows/world-interaction-ir.yml'
      - "test/causal-render-contract.test.mjs"
# Keep only the newest automatic verification for each ref.
concurrency:
  group: world-interaction-ir-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  causal-parity:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          rustup target add wasm32-unknown-unknown
          cargo test --manifest-path compiler/Cargo.toml
          cargo test --manifest-path kernels/world-rigid/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path kernels/world-rigid/Cargo.toml
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Cross-domain physics material environment audio render Rust and network
        run: node --test test/world-interaction-ir.test.mjs test/world-couplings.test.mjs test/causal-render-contract.test.mjs test/contact-laws.test.mjs test/audio-foundation.test.mjs test/authority-ledger.test.mjs test/emergence-rigid-batch.test.mjs
      - name: Bounded physical system and world code parity
        run: node --test test/world-compiler.test.mjs test/scene-performance.test.mjs
      - name: Emergent proving ground including fluids soil weather rotation and wave fields
        run: node --test test/proving-ground.test.mjs test/shallow-water-basin.test.mjs test/kernel-depth.test.mjs test/wave-field.test.mjs
