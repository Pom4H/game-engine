name: FPS budget - physics
on:
  push:
    branches: [main]
    paths:
      - 'src/physics/**'
      - 'src/environment/surface-state.ts'
      - 'test/surface-fastpath.test.mjs'
      - 'src/core/spatial-hash.ts'
      - 'src/scene/scene.ts'
      - 'src/scene/performance.ts'
      - 'tools/fps/**'
      - '.github/workflows/fps-physics.yml'
      - 'test/ci-runner-policy.test.mjs'
  workflow_dispatch:
# Keep only the newest automatic verification for each ref.
concurrency:
  group: fps-physics-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  physics-budget:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test test/ci-runner-policy.test.mjs test/surface-fastpath.test.mjs test/contact-laws.test.mjs test/spatial-broadphase.test.mjs test/world-direct-execution.test.mjs
      - run: node tools/fps/physics-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: fps-physics-budget
          path: artifacts/fps/physics-budget.json
