name: Winter Promo

on:
  push:
    branches: [main]
    paths:
      - 'src/scene/**'
      - 'src/audio/**'
      - 'tools/promo/**'
  workflow_dispatch:

concurrency:
  group: winter-promo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Locate Chrome
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\chromium.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { $chrome = (Get-Command chromium.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw "Chrome/Chromium not found on self-hosted worker" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $chrome"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Check ffmpeg
        run: ffmpeg -version
      - name: Render high-quality winter promo
        run: node tools/promo/capture.mjs all
      - name: Assemble promo
        run: node tools/promo/assemble.mjs
      - name: Validate video
        shell: powershell
        run: |
          $video = "artifacts/promo-v3/game-engine-winter-promo-1080p.mp4"
          if (-not (Test-Path $video)) { throw "Promo MP4 missing" }
          $size = (Get-Item $video).Length
          if ($size -lt 1000000) { throw "Promo MP4 suspiciously small: $size bytes" }
          Write-Host "Winter promo: $size bytes"
      - name: Save latest winter promo locally
        shell: powershell
        run: |
          $target = Join-Path $env:USERPROFILE "game-engine-renders\\winter-latest"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item artifacts/promo-v3/game-engine-winter-promo-1080p.mp4 $target -Force
          Write-Host "Saved latest winter promo to $target"
