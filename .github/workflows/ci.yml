name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: game-engine-ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  causal-contract:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate causal commit contract
        run: |
          git fetch origin refs/notes/causality:refs/notes/causality || echo No existing causal notes ref
          bun tools/causality/check.mjs HEAD --against-notes causality

  visual-fast:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    outputs:
      hero_gap: ${{ steps.hero.outputs.hero_gap }}
      best_gap: ${{ steps.hero.outputs.best_gap }}
      best_id: ${{ steps.hero.outputs.best_id }}
      mean_hot_ms: ${{ steps.hero.outputs.mean_hot_ms }}
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build render path
        run: bun run build
      - name: Fast engine invariants
        run: node --test test/core.test.mjs test/deformation.test.mjs test/irradiance.test.mjs test/material-textures.test.mjs test/packed-mesh.test.mjs test/vehicle-interaction.test.mjs
      - name: Radiometric pixel oracle
        run: node tools/render-oracle.mjs
      - name: Verify complete Winter Hero reference image
        run: ffmpeg -v error -err_detect explode -i tools/reality/winter-hero/reference.jpg -frames:v 1 -f null -
      - name: Winter Hero batch search
        id: hero
        run: |
          node dist/cli.js render-batch tools/render-lab/winter-hero-sweep.mjs --reference tools/reality/winter-hero/reference.jpg --width 480 --height 360 --frames 2 --keep 3 --out-dir artifacts/winter-hero
          node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('artifacts/winter-hero/report.json','utf8')),p=r.results.find(x=>x.id==='production')??r.results[0];fs.appendFileSync(process.env.GITHUB_OUTPUT,'hero_gap='+p.heroGap+'\n'+'best_gap='+r.best.heroGap+'\n'+'best_id='+r.best.id+'\n'+'mean_hot_ms='+r.meanHotCaptureMilliseconds+'\n')"
      - name: Preview Winter Hero without artifact storage
        run: node tools/render-lab/log-preview.mjs artifacts/winter-hero
      - name: Preview best Winter Hero candidate
        run: node tools/render-lab/log-preview.mjs artifacts/winter-hero best
      - name: Record moving winter hero from WebGPU
        run: |
          node dist/cli.js record tools/promo/moving-hero.scene.mjs --duration 2 --fps 12 --width 480 --height 360 --out artifacts/winter-hero/moving-hero.mp4
          node tools/render-lab/log-video.mjs artifacts/winter-hero/moving-hero.mp4
      # Pages is owned by pages.yml. A metric run must not force-push over the live look-dev UI.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: visual-fast-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  performance-1080:
    if: github.event_name == 'pull_request'
    needs: visual-fast
    runs-on: self-hosted
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build render path
        run: bun run build
      - name: Clear-day 1080p sustained runtime gate
        env:
          BENCH_SCENE: clear-day.scene.mjs
          BENCH_USE_SCENE_CAMERA: "1"
          BENCH_TIME: "0"
          BENCH_CASES: 1920x1080
          BENCH_WARMUP_MS: "1500"
          BENCH_SAMPLE_MS: "5000"
          BENCH_OUT: artifacts/performance/clear-day.json
          MAX_P95_FRAME_MS: "24"
        run: |
          node tools/promo/benchmark.mjs
          node tools/perf/assert-60fps.mjs artifacts/performance/clear-day.json
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: performance-1080-${{ github.event.pull_request.head.sha }}
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 7


  reality-fast:
    if: always() && github.event_name == 'pull_request' && needs.visual-fast.result == 'success'
    needs: [visual-fast, performance-1080]
    runs-on: self-hosted
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Check Stanford scope
        id: scope
        run: node tools/ci/stanford-scope.mjs
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: 1.4.2
      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Build reality render path
        if: steps.scope.outputs.run == 'true'
        run: bun run build
      - name: Geometry oracle preflight
        if: steps.scope.outputs.run == 'true'
        run: node --test test/render-subdivision.test.mjs
      - name: Persistent reality cache path
        if: steps.scope.outputs.run == 'true'
        run: echo REALITY_DATA_ROOT=%USERPROFILE%\.cache\game-engine-reality\stanford-orb>>%GITHUB_ENV%
      - name: Bootstrap Stanford-ORB Car
        if: steps.scope.outputs.run == 'true'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\reality\stanford-orb\bootstrap.ps1
      - name: Prepare calibrated captures
        if: steps.scope.outputs.run == 'true'
        run: node tools/reality/stanford-orb/prepare.mjs --out artifacts/reality/stanford-orb
      - name: RealityGap held-out
        if: steps.scope.outputs.run == 'true'
        run: node tools/reality/stanford-orb/run.mjs --dir artifacts/reality/stanford-orb --baseline tools/reality/stanford-orb/baseline.json --assert
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.run == 'true'
        continue-on-error: true
        with:
          name: reality-fast-${{ github.event.pull_request.head.sha }}
          path: artifacts/reality/
          if-no-files-found: warn
          retention-days: 7

  causal-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: [causal-contract]
    runs-on: self-hosted
    timeout-minutes: 3
    concurrency:
      group: game-engine-causal-notes
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: cmd
    env:
      CAUSAL_SHA: ${{ github.event.pull_request.head.sha }}
      REALITY_JOB_RESULT: release
      VISUAL_JOB_RESULT: release
      PERFORMANCE_JOB_RESULT: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: reality-fast-${{ github.event.pull_request.head.sha }}
          path: causal-input/reality
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: visual-fast-${{ github.event.pull_request.head.sha }}
          path: causal-input/visual
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: performance-1080-${{ github.event.pull_request.head.sha }}
          path: causal-input/performance
      - name: Build causal evidence
        run: node tools/causality/record.mjs --subject "%CAUSAL_SHA%" --input causal-input --out artifacts/causality/evidence.json
      - name: Attach evidence to the evaluated commit
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/notes/causality:refs/notes/causality || echo No existing causal notes ref
          git notes --ref=causality add -f -F artifacts/causality/evidence.json "%CAUSAL_SHA%"
          git push origin refs/notes/causality
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: causal-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/causality/
          if-no-files-found: warn
          retention-days: 90

  verify:
    # The expensive full-scene/video suite is a release/main guard, not an experiment loop.
    # PR experiments are guarded by visual-fast + 1080p performance + Stanford RealityGap.
    needs: [causal-contract]
    if: always() && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck, build and tests
        run: bun run ci
      - name: Renderer consistency full
        run: node tools/photorealism/run.mjs --mode full --out artifacts/photorealism-full
      - name: WebGPU production smoke
        run: |
          if not exist artifacts mkdir artifacts
          node dist/cli.js render examples/window-gauntlet.ts --time 0.55 --width 1280 --height 720 --out artifacts/gpu-smoke.png
          node tools/check-png.mjs artifacts/gpu-smoke.png
      - name: Winter street visual regression
        run: |
          node dist/cli.js render tools/promo/street.scene.mjs --time 0 --width 1920 --height 1080 --out artifacts/winter-street-now.png
          node dist/cli.js render tools/promo/street.scene.mjs --time 8 --width 1920 --height 1080 --out artifacts/winter-street-car.png
          node dist/cli.js render tools/promo/street.scene.mjs --time 24 --width 1920 --height 1080 --out artifacts/winter-street-footprints.png
          node tools/check-png.mjs artifacts/winter-street-now.png
          node tools/check-png.mjs artifacts/winter-street-car.png
          node tools/check-png.mjs artifacts/winter-street-footprints.png
      - name: Clear-day M3 visual target
        run: |
          node dist/cli.js render tools/promo/clear-day.scene.mjs --time 0 --width 1920 --height 1080 --out artifacts/m3-clear-day-front.png
          node tools/check-png.mjs artifacts/m3-clear-day-front.png
      - name: Deterministic video path
        run: node dist/cli.js record examples/window-gauntlet.ts --duration 2.5 --fps 24 --width 1280 --height 720 --out artifacts/gpu-smoke.mp4
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: game-engine-ci-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14