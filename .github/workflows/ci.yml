name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: game-engine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run ci

  gpu-smoke:
    needs: core
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run build
      - name: WebGPU render through production browser runtime
        run: |
          if not exist artifacts mkdir artifacts
          node dist/cli.js render examples/window-gauntlet.ts --time 0.55 --width 1280 --height 720 --out artifacts/gpu-smoke.png
      - name: Verify rendered pixels
        run: node tools/check-png.mjs artifacts/gpu-smoke.png
      - name: Deterministic video path
        run: node dist/cli.js record examples/window-gauntlet.ts --duration 2.5 --fps 24 --width 1280 --height 720 --out artifacts/gpu-smoke.mp4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-engine-gpu-smoke-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
