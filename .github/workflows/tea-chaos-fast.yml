name: Tea Chaos Fast
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tea-chaos-fast
  cancel-in-progress: true
jobs:
  render:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tea-chaos-input
          path: artifacts/tea-chaos
          github-token: ${{ github.token }}
          run-id: 37308402207
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          bun install --frozen-lockfile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          bun run build
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Add procedural spit SFX to the existing VTL dialogue
        run: |
          node tools/tea-performance/spit-sfx.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ffmpeg -y -v error -i artifacts/tea-chaos/dialogue-release.wav -i artifacts/tea-chaos/spit-sfx.wav -filter_complex "[0:a]volume=1.0[a0];[1:a]volume=0.72[a1];[a0][a1]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,alimiter=limit=0.94[a]" -map "[a]" -ar 44100 -ac 2 -c:a pcm_s16le artifacts/tea-chaos/dialogue-with-spit.wav
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Hardware WebGPU visual-only rerender
        env:
          TEA_REQUIRE_HARDWARE: '1'
          TEA_WIDTH: '960'
          TEA_HEIGHT: '540'
          TEA_FPS: '20'
          TEA_OUTPUT: artifacts/tea-chaos
          TEA_PLAN: artifacts/tea-chaos/motor-plan.json
          TEA_AUDIO: artifacts/tea-chaos/dialogue-with-spit.wav
          TEA_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe","$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")
          $env:CHROME_PATH=$candidates|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $env:CHROME_PATH){throw 'Chrome is required'}
          Remove-Item Env:TEA_SOFTWARE_GPU -ErrorAction SilentlyContinue
          node tools/tea-performance/capture.mjs video
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $e=Get-Content artifacts/tea-chaos/video-evidence.json -Raw|ConvertFrom-Json
          if($e.backend -ne 'webgpu-hardware'){throw "Not hardware WebGPU"}
      - uses: actions/upload-artifact@v4
        with:
          name: tea-chaos-fast-video-v2
          path: |
            artifacts/tea-chaos/tea-performance.mp4
            artifacts/tea-chaos/video-evidence.json
          retention-days: 2
