name: Network foundation
on:
  push:
    branches: [main]
    paths:
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/network/**'
      - 'test/network-foundation.test.mjs'
      - 'test/authority-ledger.test.mjs'
      - 'docs/NETWORK_FOUNDATION.md'
      - 'docs/SERVER_AUTHORITY.md'
      - 'package.json'
      - '.github/workflows/network-foundation.yml'
  pull_request:
    paths:
      - 'src/index.ts'
      - 'src/scene/scene.ts'
      - 'src/core/**'
      - 'src/network/**'
      - 'test/network-foundation.test.mjs'
      - 'docs/NETWORK_FOUNDATION.md'
      - 'package.json'
      - '.github/workflows/network-foundation.yml'
      - "test/authority-ledger.test.mjs"
      - "docs/SERVER_AUTHORITY.md"

concurrency:
  group: network-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/network-foundation.test.mjs test/authority-ledger.test.mjs test/kernel-depth.test.mjs
