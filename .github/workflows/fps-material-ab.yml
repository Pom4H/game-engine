name: Effects GI A/B - self-hosted RDNA3
on:
  workflow_dispatch:
concurrency:
  group: effects-gi-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      BASELINE_SHA: c9c5ecbedd291df8ed1100e784c8038d4c9904ee
      RENDER_PROFILING: '1'
      RENDER_REQUIRE_HARDWARE: '1'
      RENDER_FPS_BENCH_FRAMES: '90'
      RENDER_WARMUP_FRAMES: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Baseline GPU frame and reference images
        run: |
          $ErrorActionPreference='Stop'
          git -c advice.detachedHead=false checkout -f $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RENDER_FPS_BENCH_LABEL='baseline'
          node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/promo/render-views.mjs 1920 1080
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/fps/label-ab-baseline | Out-Null
          Copy-Item artifacts/render34.png,artifacts/render35.png,artifacts/render36.png,artifacts/render37.png artifacts/fps/label-ab-baseline/ -Force
      - name: Same-device optimized GPU frame and image equivalence
        run: |
          $ErrorActionPreference='Stop'
          git -c advice.detachedHead=false checkout -f $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RENDER_FPS_BENCH_LABEL='optimized'
          node tools/render-harness.mjs tools/promo/clear-day.scene.mjs tools/promo/render-views.mjs 1920 1080
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/fps/compare-gpu-images.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: effects-gi-ab-rdna3
          path: |
            artifacts/fps/gpu-budget-baseline.json
            artifacts/fps/gpu-budget-optimized.json
            artifacts/fps/shader-ab.json
            artifacts/fps/label-ab-baseline/*.png
            artifacts/render34.png
            artifacts/render35.png
            artifacts/render36.png
            artifacts/render37.png
