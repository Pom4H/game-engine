name: Speech Face Lab
on:
  push:
    branches: [codex/native-speech-tea-performance]
    paths: ['.github/workflows/speech-face-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile && bun run typecheck && bun run build
      - name: Reproducible lab inputs
        run: |
          mkdir -p artifacts/reproduction
          git archive --format=tar HEAD | gzip > artifacts/reproduction/source.tar.gz
          tar -czf artifacts/reproduction/build.tar.gz dist node_modules
          git rev-parse HEAD > artifacts/reproduction/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: speech-face-reproduction
          path: artifacts/reproduction
          retention-days: 1
