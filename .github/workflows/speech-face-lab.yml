name: Speech Face Lab
on:
  push:
    branches: [codex/native-speech-tea-performance]
    paths: ['.github/workflows/speech-face-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch verified CC0 anatomical reference, not application code
        run: |
          mkdir -p artifacts/reference
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj -o artifacts/reference/base.obj
          test "$(git hash-object artifacts/reference/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/makehumancommunity/makehuman/master/LICENSE.ASSETS.md -o artifacts/reference/LICENSE.ASSETS.md
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/makehumancommunity/makehuman/master/LICENSE.md -o artifacts/reference/LICENSE.md
          sha256sum artifacts/reference/*
      - uses: actions/upload-artifact@v4
        with:
          name: face-topology-reference
          path: artifacts/reference
          retention-days: 1
