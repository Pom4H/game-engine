name: Material ontology verification
on:
  push:
    branches: [refactor/material-ontology-surface-state]
permissions:
  contents: read
concurrency:
  group: material-ontology-verification
  cancel-in-progress: true
jobs:
  core:
    runs-on: [self-hosted, gpu, windows]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run ci
