name: CI runner policy - self-hosted Windows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'test/ci-runner-policy.test.mjs'
  workflow_dispatch:
concurrency:
  group: ci-runner-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Forbid hosted Apple and incorrect performance runners
        shell: powershell
        run: |
          node --test test/ci-runner-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
