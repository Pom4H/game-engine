name: City Benchmark - JS vs Rust on self-hosted GPU
on:
  push:
    branches: [main]
    paths:
      - 'tools/city-benchmark/**'
      - 'test/city-benchmark.test.mjs'
      - 'kernels/world-rigid/**'
      - 'src/physics/rigid-wasm.ts'
      - '.github/workflows/city-benchmark.yml'
  workflow_dispatch:
concurrency:
  group: city-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Ensure Rust on Windows (PowerShell, no bash dependency)
        run: |
          $ErrorActionPreference='Stop'
          $cargoDir=Join-Path $env:USERPROFILE '.cargo\bin'
          if (Test-Path $cargoDir) {
            $env:PATH="$cargoDir;$env:PATH"
            $cargoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer=Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer
            & $installer -y --profile minimal --default-toolchain stable --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH="$cargoDir;$env:PATH"
            $cargoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Compile authoritative Rust rigid contact kernel
        run: |
          cargo test --manifest-path kernels/world-rigid/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --target wasm32-unknown-unknown --manifest-path kernels/world-rigid/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate city recipe and existing JS/Rust parity
        run: |
          node --test test/city-benchmark.test.mjs test/rigid-wasm.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Same authored City world and moving contacts in JS and Rust
        run: |
          node tools/city-benchmark/physics-benchmark.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: City route - JS CPU/GPU frame pacing
        env:
          RENDER_PROFILING: '1'
          RENDER_REQUIRE_HARDWARE: '1'
          RENDER_FPS_BENCH_FRAMES: '180'
          RENDER_WARMUP_FRAMES: '12'
          RENDER_FPS_ROUTE_MODULE: 'tools/city-benchmark/route.mjs'
          RENDER_RIGID_BACKEND: 'js'
          RENDER_FPS_BENCH_LABEL: 'city-js'
          RENDER_FPS_LAST_FRAME: 'js'
        run: |
          node tools/render-harness.mjs tools/city-benchmark/scene.mjs tools/city-benchmark/views.mjs 1920 1080
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Same city route - Rust/WASM rigid contacts
        env:
          RENDER_PROFILING: '1'
          RENDER_REQUIRE_HARDWARE: '1'
          RENDER_FPS_BENCH_FRAMES: '180'
          RENDER_WARMUP_FRAMES: '12'
          RENDER_FPS_ROUTE_MODULE: 'tools/city-benchmark/route.mjs'
          RENDER_RIGID_BACKEND: 'rust'
          RENDER_FPS_BENCH_LABEL: 'city-rust'
          RENDER_FPS_LAST_FRAME: 'rust'
        run: |
          node tools/render-harness.mjs tools/city-benchmark/scene.mjs tools/city-benchmark/views.mjs 1920 1080
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real hardware and physical/image parity
        run: |
          node tools/city-benchmark/compare-render.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: city-benchmark-js-rust
          path: |
            artifacts/city-benchmark/
            artifacts/fps/gpu-budget-city-js.json
            artifacts/fps/gpu-budget-city-rust.json
            kernels/world-rigid/target/wasm32-unknown-unknown/release/world_rigid_kernel.wasm
