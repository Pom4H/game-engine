name: M3 compression benchmark
on:
  push:
    paths:
      - '.github/workflows/m3-compression.yml'
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Measure M3 compression
        run: |
          node --input-type=module <<'NODE'
          import {gzipSync,brotliCompressSync,constants} from 'node:zlib';
          import {M3_HIGH_FIDELITY_SHELL,M3_FBX_PARTS_FIDELITY,m3FbxParts} from './dist/index.js';
          const chunks=[];
          const add=b64=>{if(b64)chunks.push(Buffer.from(b64,'base64'))};
          const addMesh=m=>{add(m.positionsU16Base64);add(m.normalsOct8Base64);add(m.colorsRGBA8Base64);add(m.indicesU16Base64);add(m.indicesU32Base64)};
          addMesh(M3_HIGH_FIDELITY_SHELL);
          const seen=new Set();
          for(const p of m3FbxParts()){
            const m=p.mesh;
            const key=JSON.stringify([m.positions,m.normals,m.indices,m.colors??null]);
            if(seen.has(key))continue;
            seen.add(key);
            const f32=a=>Buffer.from(new Float32Array(a).buffer);
            const max=Math.max(...m.indices), idx=max<=65535?Buffer.from(new Uint16Array(m.indices).buffer):Buffer.from(new Uint32Array(m.indices).buffer);
            chunks.push(f32(m.positions),f32(m.normals),idx);
            if(m.colors)chunks.push(f32(m.colors));
          }
          const raw=Buffer.concat(chunks);
          const gz=gzipSync(raw,{level:9});
          const br=brotliCompressSync(raw,{params:{[constants.BROTLI_PARAM_QUALITY]:11}});
          console.log(JSON.stringify({declaredPacked:M3_FBX_PARTS_FIDELITY.totalPackedPayloadBytes,reconstructedRaw:raw.length,gzip9:gz.length,brotli11:br.length},null,2));
          NODE
