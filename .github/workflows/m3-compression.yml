name: M3 compression benchmark
# render harness verification: include CPU meshes
on:
  push:
    paths:
      - '.github/workflows/m3-compression.yml'
# Keep only the newest automatic verification for each ref.
concurrency:
  group: m3-compression-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  measure:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Measure committed packed M3 payload
        shell: bash
        run: |
          python3 - <<'PY'
          import re,base64,gzip,lzma
          files=['src/vehicles/m3-shell.ts','src/vehicles/m3-fbx-parts.ts']
          chunks=[]
          for path in files:
            s=open(path,encoding='utf8').read()
            for key in ('positionsU16Base64','normalsOct8Base64','colorsRGBA8Base64','indicesU16Base64','indicesU32Base64'):
              for x in re.findall(key+r":'([^']+)'",s):
                chunks.append(base64.b64decode(x))
          raw=b''.join(chunks)
          print('M3_RAW_BYTES='+str(len(raw)))
          print('M3_GZIP9_BYTES='+str(len(gzip.compress(raw,compresslevel=9))))
          open('/tmp/m3.raw','wb').write(raw)
          PY
          BROTLI=$(brotli -q 11 -c /tmp/m3.raw | wc -c)
          echo M3_BROTLI11_BYTES=$BROTLI
          # benchmark intentionally reports sizes only

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build engine
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Render current engine scene
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/render-scene.mjs tools/render-demo.scene.mjs 1280 720 artifacts/render.png
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: game-engine-render
          path: artifacts/render.png
          if-no-files-found: error
          retention-days: 1

      - name: Render CPU artifact from the same engine scene
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/render-cpu.mjs 1280 720 artifacts/render-cpu.png
      - name: Upload CPU render
        uses: actions/upload-artifact@v4
        with:
          name: game-engine-render-cpu
          path: artifacts/render-cpu.png
          if-no-files-found: error
          retention-days: 1
