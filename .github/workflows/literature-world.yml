name: Literature to WebGPU (self-hosted)
on:
  push:
    branches: [main]
    paths:
      - 'src/literature/**'
      - 'tools/literature/**'
      - 'test/literature-model.test.mjs'
      - 'examples/literature/**'
      - '.github/workflows/literature-world.yml'
  workflow_dispatch:
concurrency:
  group: literature-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  literature-render:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test test/literature-model.test.mjs test/literature.test.mjs
      - name: Generate world from Russian prose without JSON input
        run: node tools/literature/author.mjs examples/literature/pereprava.txt --provider offline --world examples/literature/pereprava.world
      - name: Locate hardware Chrome
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Chromium\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw 'Chrome not found on self-hosted GPU runner' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real hardware WebGPU render
        env:
          RENDER_REQUIRE_HARDWARE: '1'
          RENDER_PROFILING: '1'
          RENDER_WARMUP_FRAMES: '12'
        run: node tools/render-harness.mjs tools/literature/generated.scene.mjs tools/literature/generated.views.mjs 1280 720
      - name: Verify actual PNG captures
        run: |
          $images = @(Get-ChildItem artifacts/literature/*.png)
          if ($images.Count -lt 2) { throw 'Two observer views were not rendered' }
          foreach ($img in $images) {
            $b = [IO.File]::ReadAllBytes($img.FullName)
            if ($b.Length -lt 1000 -or $b[0] -ne 137 -or $b[1] -ne 80 -or $b[2] -ne 78 -or $b[3] -ne 71) {
              throw "Invalid render $($img.Name)"
            }
          }
      - name: Preserve GPU evidence
        if: always()
        run: |
          $target = Join-Path $env:USERPROFILE 'game-engine-renders\literature'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item artifacts/literature/*.png,artifacts/literature/*.json,artifacts/render-hud.json $target -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-webgpu
          retention-days: 1
          path: |
            artifacts/literature/*.json
            artifacts/literature/*.png
            artifacts/render-hud.json
