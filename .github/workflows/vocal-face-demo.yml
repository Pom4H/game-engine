name: Vocal Face Demo
on:
  push:
    branches: [main]
    paths:
      - 'src/audio/vocal-tract.ts'
      - 'src/animation/vocal-face.ts'
      - 'tools/vocal-face-demo/**'
      - 'test/vocal-face.test.mjs'
      - '.github/workflows/vocal-face-demo.yml'
  workflow_dispatch:

concurrency:
  group: vocal-face-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --test test/vocal-tract.test.mjs test/vocal-face.test.mjs
      - name: Locate hardware Chrome
        run: |
          $candidates = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source }
          if (-not $chrome) { throw 'Chrome not found on GPU worker' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: ffmpeg -version
      - name: Render synchronized physical face and voice
        run: node tools/vocal-face-demo/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vocal-face-mp4
          path: |
            artifacts/vocal-face/i-am-alive-face.mp4
            artifacts/vocal-face/poster.png
            artifacts/vocal-face/evidence.json
          retention-days: 1
