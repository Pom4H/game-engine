<!doctype html><html lang="ru"><meta charset="utf-8"><title>Game Engine — Winter City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118}canvas{width:100%;height:100%;display:block}#type{position:absolute;left:64px;bottom:70px;color:#fff;font-family:Arial,sans-serif;text-shadow:0 2px 18px #0006;pointer-events:none;transition:none}#brand{font-size:12px;letter-spacing:5px;opacity:.75;margin-bottom:16px}#title{font-size:29px;font-weight:400;letter-spacing:3px}#end{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#07101acc;color:white;font-family:Arial,sans-serif}#end strong{font-size:60px;letter-spacing:9px;font-weight:400}#end span{font-size:19px;letter-spacing:4px;margin-top:25px;color:#c4d6df}</style><canvas id="world"></canvas><div id="type"><div id="brand">GAME ENGINE / WINTER / LIVE ENGINE CAPTURE</div><div id="title"></div></div><div id="end"><strong>GAME ENGINE</strong><span>МАТЕРИЯ. СРЕДА. ДВИЖЕНИЕ.</span></div><script type="module">
import {Scene} from '/dist/index.js';import {WebGPURenderer} from '/dist/browser.js';import {makeCity} from '/city.mjs';import {shots} from '/shots.mjs';import {CAR,WALK,updatePedestrian,puddleAt} from '/actors.mjs';import {SnowFootprints} from '/dist/index.js';import {SnowSkin} from '/snow-surface.mjs';import {WetSpray} from '/wet-spray.mjs';
window.ready=false;window.failure=null;
try{
 const canvas=document.getElementById('world'),renderer=await WebGPURenderer.create(canvas);const m3=await(await fetch('/assets/m3.json')).json();let scene,shot,motions=[],events=[],telemetry=[],footprints,footEvents=[],sourceCount=0,snowSkin,spray;
 const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),ease=t=>t*t*(3-2*t);
 window.promo={async load(id){shot=shots.find(s=>s.id===id);const data=makeCity(shot.set,m3);sourceCount=data.sourceCount;scene=new Scene(data.spec);motions=data.motions;events=[];telemetry=[];footEvents=[];footprints=new SnowFootprints(256);snowSkin=new SnowSkin();snowSkin.initialize(scene);spray=new WetSpray(scene);await this.frame(0);},async frame(t){
   const desired=Math.round(((shot.offset??0)+t*(shot.simulationRate??1))*60);
   while(scene.tick<Math.max(1,desired)){
    scene.step();spray.step(scene,scene.time);events.push(...scene.drainEvents());
    const pose=updatePedestrian(scene,scene.time),created=footprints.update(scene.time,pose.feet,p=>{const surface=scene.winter.sample('walk-1',p[0],p[2]);return surface?{height:.183,snowDepth:surface.snowDepthM}:undefined;});
    for(const stamp of created){footEvents.push(stamp);snowSkin.stamp(scene,stamp);}
   }
   for(const m of motions){const e=scene.entities.get(m.id);e.position[0]=m.origin[0]+scene.time*m.speed;if(m.wheel)e.rotation=[0,0,-scene.time*m.speed/m.radius];}
   const car=[CAR.startX+scene.time*CAR.speed,0,CAR.z],person=[WALK.startX+scene.time*WALK.speed,0,WALK.z];
   const u=ease(Math.min(1,t/shot.duration)),base=shot.follow==='car'?car:shot.follow==='person'?person:[0,0,0];
   scene.camera={position:lerp(shot.from,shot.to,u).map((v,i)=>v+base[i]),target:lerp(shot.lookFrom,shot.lookTo,u).map((v,i)=>v+base[i]),fov:shot.fov,focusDistance:shot.focus??20,aperture:shot.aperture??0};
   document.getElementById('title').textContent=shot.title;document.getElementById('brand').textContent=shot.note??'GAME ENGINE / WINTER / LIVE ENGINE CAPTURE';document.getElementById('type').style.opacity=String(Math.min(1,t/.8,Math.max(0,(4.3-t)/1.3))*.92);const end=document.getElementById('end');end.style.display=shot.end&&t>shot.duration-3?'flex':'none';end.style.opacity=String(Math.min(1,Math.max(0,(t-shot.duration+3)/1.5)));telemetry.push({t,worldTime:scene.time,camera:scene.camera.position,target:scene.camera.target,car:[car[0],.65,car[2]],person,footprints:footprints.snapshot().length,puddle:spray.amount(scene,scene.time),snowfallRate:scene.environment.snowfallRate});
   renderer.render(scene);await renderer.flush();return this.inspect();
 },inspect:()=>({...renderer.inspect(),entities:scene?.entities.size,tick:scene?.tick,time:scene?.time,camera:scene?.camera,sourceScenery:sourceCount,footprints:footprints?.snapshot().length,sprayEmitted:spray?.emitted,m3:m3.provenance}),footsteps:()=>footEvents,events:()=>events,telemetry:()=>telemetry,snapshot:()=>scene.snapshot()};window.ready=true;
}catch(error){window.failure=error.stack??String(error);console.error(error);}
</script></html>
