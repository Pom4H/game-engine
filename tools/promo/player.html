<!doctype html><html lang="ru"><meta charset="utf-8"><title>Game Engine — Winter City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118}canvas{width:100%;height:100%;display:block}#type{position:absolute;left:64px;bottom:70px;color:#fff;font-family:Arial,sans-serif;text-shadow:0 2px 18px #0006;pointer-events:none;transition:none}#brand{font-size:12px;letter-spacing:5px;opacity:.75;margin-bottom:16px}#title{font-size:29px;font-weight:400;letter-spacing:3px}#end{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#07101acc;color:white;font-family:Arial,sans-serif}#end strong{font-size:60px;letter-spacing:9px;font-weight:400}#end span{font-size:19px;letter-spacing:4px;margin-top:25px;color:#c4d6df}</style><canvas id="world"></canvas><div id="type"><div id="brand">GAME ENGINE / PROCEDURAL WINTER</div><div id="title"></div></div><div id="end"><strong>GAME ENGINE</strong><span>МАТЕРИЯ. СРЕДА. ДВИЖЕНИЕ.</span></div><script type="module">
import {Scene} from '/dist/index.js';import {WebGPURenderer} from '/dist/browser.js';import {makeCity} from '/city.mjs';import {shots} from '/shots.mjs';
window.ready=false;window.failure=null;
try{
 const canvas=document.getElementById('world'),renderer=await WebGPURenderer.create(canvas);let scene,shot,motions=[],events=[],telemetry=[];
 const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),ease=t=>t*t*(3-2*t);
 window.promo={async load(id){shot=shots.find(s=>s.id===id);const data=makeCity(shot.set);scene=new Scene(data.spec);motions=data.motions;events=[];telemetry=[];await this.frame(0);},async frame(t){
   const desired=Math.round(t*(shot.simulationRate??1)*60);while(scene.tick<Math.max(1,desired)){scene.step();events.push(...scene.drainEvents());}
   for(const m of motions){const e=scene.entities.get(m.id);if(e){e.position[0]=m.origin[0]+scene.time*m.speed;if(m.wheel){const angle=-scene.time*m.speed/.33,c=Math.cos(angle),s=Math.sin(angle),dx=m.origin[0]-m.center[0],dy=m.origin[1]-m.center[1];e.position[0]=m.center[0]+scene.time*m.speed+c*dx-s*dy;e.position[1]=m.center[1]+s*dx+c*dy;const [rx,,rz]=m.rotation,nx=-Math.sin(rz),ny=Math.cos(rx)*Math.cos(rz),nz=Math.sin(rx)*Math.cos(rz),ax=c*nx-s*ny,ay=s*nx+c*ny;e.rotation=[Math.atan2(nz,ay),0,Math.asin(Math.max(-1,Math.min(1,-ax)))];}}}
   const u=ease(Math.min(1,t/shot.duration));scene.camera={position:lerp(shot.from,shot.to,u),target:shot.track?[-32+scene.time*4.8,1.05,-1.6]:lerp(shot.lookFrom,shot.lookTo,u),fov:shot.fov,focusDistance:shot.focus??20,aperture:shot.aperture??0};
   document.getElementById('title').textContent=shot.title;document.getElementById('brand').textContent=shot.note??'GAME ENGINE / PROCEDURAL WINTER';document.getElementById('type').style.opacity=String(Math.min(1,t/.8,Math.max(0,(4.3-t)/1.3))*.92);const end=document.getElementById('end');end.style.display=shot.id==='district'&&t>shot.duration-3?'flex':'none';end.style.opacity=String(Math.min(1,Math.max(0,(t-shot.duration+3)/1.5)));telemetry.push({t,camera:scene.camera.position,car:[-32+scene.time*4.8,.8,-1.6],snowfall:scene.environment.snowfall});
   renderer.render(scene);await renderer.flush();return this.inspect();
 },inspect:()=>({...renderer.inspect(),entities:scene?.entities.size,tick:scene?.tick,time:scene?.time,camera:scene?.camera}),events:()=>events,telemetry:()=>telemetry,snapshot:()=>scene.snapshot()};window.ready=true;
}catch(error){window.failure=error.stack??String(error);console.error(error);}
</script></html>
