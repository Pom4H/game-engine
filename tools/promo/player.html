<!doctype html><html lang="ru"><meta charset="utf-8"><title>Game Engine — Winter City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118}canvas{width:100%;height:100%;display:block}#type{position:absolute;left:64px;bottom:70px;color:#fff;font-family:Arial,sans-serif;text-shadow:0 2px 18px #0006;pointer-events:none;transition:none}#brand{font-size:12px;letter-spacing:5px;opacity:.75;margin-bottom:16px}#title{font-size:29px;font-weight:400;letter-spacing:3px}#end{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#07101acc;color:white;font-family:Arial,sans-serif}#end strong{font-size:60px;letter-spacing:9px;font-weight:400}#end span{font-size:19px;letter-spacing:4px;margin-top:25px;color:#c4d6df}</style><canvas id="world"></canvas><div id="type"><div id="brand">GAME ENGINE / WINTER / LIVE ENGINE CAPTURE</div><div id="title"></div></div><div id="end"><strong>GAME ENGINE</strong><span>МАТЕРИЯ. СРЕДА. ДВИЖЕНИЕ.</span></div><script type="module">
import {M3_PARAMETRIC_PROFILE,M3_REFERENCE_PROVENANCE,Scene,generateM3Vehicle} from '/dist/index.js';import {WebGPURenderer} from '/dist/browser.js';import {makeCity} from '/city.mjs';import {shots} from '/shots.mjs';
window.ready=false;window.failure=null;
try{
 const canvas=document.getElementById('world'),renderer=await WebGPURenderer.create(canvas),renderScale=1.5;renderer.setResolution(1920*renderScale,1080*renderScale);const m3Geometry=generateM3Vehicle(),m3={...M3_REFERENCE_PROVENANCE,triangles:m3Geometry.generatedTriangles,parts:m3Geometry.parts.length,profileBytes:new TextEncoder().encode(JSON.stringify(M3_PARAMETRIC_PROFILE)).length};let scene,shot,events=[],telemetry=[],footEvents=[],sourceCount=0;
 const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),ease=t=>t*t*(3-2*t);
 window.promo={async load(id){shot=shots.find(s=>s.id===id);const data=makeCity(shot.set);sourceCount=data.sourceCount;scene=new Scene(data.spec);events=[];telemetry=[];footEvents=[];await this.frame(0);},async frame(t){
   const desired=Math.round(((shot.offset??0)+t*(shot.simulationRate??1))*60);
   while(scene.tick<Math.max(1,desired)){
    scene.step();events.push(...scene.drainEvents());footEvents.push(...scene.contacts.drainFootsteps());
   }
   const car=scene.entities.get('passing-Body-CarPaint').position,person=scene.animation.pose('walker').position;
   const u=ease(Math.min(1,t/shot.duration)),base=shot.follow==='car'?car:shot.follow==='person'?person:[0,0,0];
   scene.camera={position:lerp(shot.from,shot.to,u).map((v,i)=>v+base[i]),target:lerp(shot.lookFrom,shot.lookTo,u).map((v,i)=>v+base[i]),fov:shot.fov,focusDistance:shot.focus??20,aperture:shot.aperture??0};
   document.getElementById('title').textContent=shot.title;document.getElementById('brand').textContent=shot.note??'GAME ENGINE / WINTER / LIVE ENGINE CAPTURE';document.getElementById('type').style.opacity=String(Math.min(1,t/.8,Math.max(0,(4.3-t)/1.3))*.92);const end=document.getElementById('end');end.style.display=shot.end&&t>shot.duration-3?'flex':'none';end.style.opacity=String(Math.min(1,Math.max(0,(t-shot.duration+3)/1.5)));telemetry.push({t,worldTime:scene.time,camera:scene.camera.position,target:scene.camera.target,car:[car[0],.65,car[2]],speedMps:Math.hypot(...(scene.entities.get(scene.spec.surfaceContacts?.wheels?.[0]?.entityId)?.body?.velocity??[0,0,0])),person,footprints:scene.contacts.footprints.snapshot().length,puddle:scene.contacts.wetness,snowfallRate:scene.environment.snowfallRate});
   await renderer.prepareMaterials(scene);renderer.render(scene);await renderer.flush();return this.inspect();
 },inspect:()=>({...renderer.inspect(),quality:{objective:'quality',renderScale,output:[1920,1080],internal:[1920*renderScale,1080*renderScale]},entities:scene?.entities.size,tick:scene?.tick,time:scene?.time,camera:scene?.camera,sourceScenery:sourceCount,footprints:scene?.contacts.footprints.snapshot().length,sprayEmitted:scene?.contacts.sprayEmitted,nativeContacts:scene?.contacts.inspect(),systems:scene?.lastExecution,m3}),footsteps:()=>footEvents,events:()=>events,telemetry:()=>telemetry,snapshot:()=>scene.snapshot()};window.ready=true;
}catch(error){window.failure=error.stack??String(error);console.error(error);}
</script></html>
