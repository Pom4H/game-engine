<!doctype html>
<html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>

#hud{position:fixed;left:18px;top:16px;color:#f6f3ea;font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;background:#11100dc2;border:1px solid #ffffff18;padding:9px 11px;min-width:218px;backdrop-filter:blur(6px);pointer-events:none}
#phase{font-weight:700;letter-spacing:.06em;margin-bottom:5px}#metrics{color:#d5d0c5;white-space:pre}
</style>
<canvas id="world"></canvas><div id="hud"><div id="phase">INIT</div><div id="metrics"></div></div>
<script>
window.ready=false;window.failure=null;
window.addEventListener('error',event=>{window.failure=event.error?.stack??event.message??('Resource error: '+event.target?.src);});
window.addEventListener('unhandledrejection',event=>{window.failure=event.reason?.stack??String(event.reason);});
</script>
<script type="module">
import {Scene,M3InteractionRig,generateM3Vehicle} from '/dist/index.js';
import {WebGPURenderer} from '/dist/browser.js';
import {VEHICLE_ABUSE_DURATION,createVehicleAbuseScript,humanPose,phaseAt} from '/timeline.mjs';

window.ready=false;window.failure=null;
try{
const canvas=document.getElementById('world'),renderer=await WebGPURenderer.create(canvas),geometry=generateM3Vehicle();
const paint=[.040,.052,.068,1];
const roleMaterial=role=>role==='paint'?{kind:'default',color:paint,roughness:.18,metalness:.10}:role==='glass'?{kind:'default',color:[.018,.028,.036,1],roughness:.075,metalness:.12,pattern:'window'}:role==='tire'?{kind:'default',color:[.016,.017,.018,1],roughness:.97,pattern:'rubber'}:role==='rim'||role==='metal'?{kind:'steel',color:[.12,.13,.14,1],roughness:.20,metalness:.92}:{kind:'default',color:[.028,.031,.034,1],roughness:.44};
const carEntities=geometry.parts.filter(part=>part.role!=='light'&&part.role!=='tail'&&part.role!=='glass').map(part=>({id:'m3-'+part.id,position:[...part.position],rotation:[...(part.rotation??[0,0,0])],mesh:part.mesh,material:roleMaterial(part.role)}));
for(const side of [-1,1]){
 carEntities.push({id:'m3-headlight-slim-'+side,position:[2.365,.755,side*.56],rotation:[0,0,0],mesh:{kind:'box',size:[.026,.040,.25]},material:{kind:'default',color:[.16,.19,.21,1],roughness:.16,metalness:.12,emissive:[.018,.023,.029]}});
 carEntities.push({id:'m3-tail-slim-'+side,position:[-2.365,.73,side*.57],rotation:[0,0,0],mesh:{kind:'box',size:[.026,.038,.25]},material:{kind:'default',color:[.12,.008,.006,1],roughness:.20,metalness:.04,emissive:[.018,.001,.001]}});
} 
carEntities.push(
 {id:'m3-cabin-core',position:[-.05,1.02,0],rotation:[0,0,0],mesh:{kind:'box',size:[1.52,.70,1.42]},material:{kind:'default',color:[.010,.014,.018,1],roughness:.82}},
 {id:'m3-dashboard',position:[.58,.90,0],rotation:[0,0,0],mesh:{kind:'box',size:[.34,.16,1.28]},material:{kind:'default',color:[.018,.020,.021,1],roughness:.90}}
);
const human=[
 {id:'person:torso',mesh:{kind:'box',size:[1,1,1]},material:{kind:'default',color:[.17,.20,.19,1],roughness:.92}},
 {id:'person:head',mesh:{kind:'sphere',radius:.5,segments:20},material:{kind:'default',color:[.45,.31,.24,1],roughness:.78}},
 ...['l-upper-arm','l-forearm','r-upper-arm','r-forearm','l-thigh','l-shin','r-thigh','r-shin'].map(id=>({id:'person:'+id,mesh:{kind:'cylinder',radius:.5,height:1,segments:14},material:{kind:'default',color:id.includes('arm')?[.105,.11,.105,1]:[.055,.058,.06,1],roughness:.95}})),
 ...['l-hand','r-hand'].map(id=>({id:'person:'+id,mesh:{kind:'sphere',radius:.5,segments:12},material:{kind:'default',color:[.43,.29,.22,1],roughness:.8}})),
 ...['l-foot','r-foot'].map(id=>({id:'person:'+id,mesh:{kind:'box',size:[1,1,1]},material:{kind:'default',color:[.055,.06,.062,1],roughness:.96}})),
];
const yardEntities=[
 {id:'ground',position:[0,-.17,0],mesh:{kind:'box',size:[26,.12,18]},material:{kind:'concrete',color:[.34,.315,.275,1],roughness:.86},environmental:{surfaceUse:'road'}},
 {id:'garage-back',position:[0,1.45,4.72],mesh:{kind:'box',size:[22,3.15,.38]},material:{kind:'concrete',color:[.57,.545,.49,1],roughness:.91,pattern:'plaster',ageYears:24}},
 {id:'garage-roof',position:[0,3.06,4.63],mesh:{kind:'box',size:[22,.24,1.15]},material:{kind:'concrete',color:[.32,.31,.29,1],roughness:.92,ageYears:28}},
 {id:'garage-lintel',position:[0,2.63,4.47],mesh:{kind:'box',size:[22,.18,.16]},material:{kind:'concrete',color:[.39,.38,.35,1],roughness:.9,ageYears:22}},
];
const doorXs=[-8.1,-5.4,-2.7,0,2.7,5.4,8.1];
for(let bay=0;bay<doorXs.length;bay++){
 const x=doorXs[bay];
 yardEntities.push({id:'garage-door-'+bay,position:[x,1.17,4.49],mesh:{kind:'box',size:[2.42,2.34,.055]},material:{kind:'default',color:[.66+.018*(bay%2),.645+.014*(bay%2),.61+.010*(bay%2),1],roughness:.72,metalness:.22,ageYears:16}});
 for(let row=1;row<9;row++)yardEntities.push({id:'garage-slat-'+bay+'-'+row,position:[x,.12+row*.255,4.455],mesh:{kind:'box',size:[2.34,.018,.018]},material:{kind:'default',color:[.34,.335,.325,1],roughness:.76}});
 yardEntities.push({id:'garage-number-'+bay,position:[x,2.10,4.445],mesh:{kind:'box',size:[.24,.20,.014]},material:{kind:'default',color:[.10,.095,.085,1],roughness:.9}});
}
for(let i=0;i<=doorXs.length;i++)yardEntities.push({id:'garage-pillar-'+i,position:[-9.45+i*2.7,1.36,4.39],mesh:{kind:'box',size:[.22,2.75,.28]},material:{kind:'concrete',color:[.43,.415,.38,1],roughness:.94,ageYears:30}});
yardEntities.push(
 {id:'tool-cabinet',position:[-3.85,.48,3.72],mesh:{kind:'box',size:[.72,.96,.48]},material:{kind:'default',color:[.34,.035,.025,1],roughness:.58,metalness:.38}},
 {id:'cabinet-top',position:[-3.85,.98,3.72],mesh:{kind:'box',size:[.76,.045,.52]},material:{kind:'steel',color:[.12,.12,.115,1],roughness:.32,metalness:.82}},
 {id:'dumpster',position:[7.2,.64,3.70],mesh:{kind:'box',size:[1.35,1.28,.82]},material:{kind:'default',color:[.12,.19,.13,1],roughness:.88,ageYears:18}},
 {id:'crate',position:[-5.0,.25,3.65],mesh:{kind:'box',size:[.74,.50,.62]},material:{kind:'default',color:[.32,.20,.105,1],roughness:.93}},
 {id:'puddle-a',position:[4.0,-.103,-1.2],mesh:{kind:'box',size:[2.6,.012,1.2]},material:{kind:'glass',color:[.055,.075,.085,.28],roughness:.08,metalness:.08}},
 {id:'puddle-b',position:[-4.6,-.102,1.45],mesh:{kind:'box',size:[1.7,.012,.72]},material:{kind:'glass',color:[.05,.065,.075,.25],roughness:.09}}
);
for(let i=0;i<5;i++)yardEntities.push({id:'tire-stack-'+i,position:[-5.1,.12+i*.19,3.18],rotation:[Math.PI/2,0,0],mesh:{kind:'torus',radius:.31,tube:.085,segments:24},material:{kind:'default',color:[.025,.025,.024,1],roughness:.98,pattern:'rubber'}});
for(let i=0;i<7;i++)yardEntities.push({id:'yard-seam-'+i,position:[0,-.102,-5.8+i*1.75],mesh:{kind:'box',size:[21,.012,.018]},material:{kind:'default',color:[.08,.075,.067,1],roughness:.98}});

const scene=new Scene({
 version:1,seed:26092026,gravity:[0,-9.81,0],ground:-.11,clearColor:[.52,.68,.86,1],
 environment:{temperatureC:15,humidity:.43,precipitation:'rare',snowfall:'none',sunlight:.92,groundMoisture:.18,wind:[.8,0,.25],clock:{startHour:15.2}},
 rendering:{sunDirection:[.55,.65,-.52],sunColor:[1.0,.90,.72],skyColor:[.52,.68,.88],sunIntensity:3.15,exposure:1.12,shadowExtent:30,fogDensity:.0007},
 camera:{position:[4.8,1.75,-5.0],target:[.35,.82,-.05],fov:40,focusDistance:7,aperture:.035},
 entities:[
  ...yardEntities,
  ...carEntities,
  {id:'door-opening',position:[.43,.77,-.947],mesh:{kind:'polygon-prism',points:[[-.76,-.41],[.72,-.41],[.66,.39],[-.62,.39]],thickness:.028,axis:2},material:{kind:'default',color:[.008,.009,.010,1],roughness:.96}},
  {id:'door-panel',position:[.43,.77,-.962],mesh:{kind:'polygon-prism',points:[[-.73,-.38],[.70,-.38],[.63,.37],[-.59,.37]],thickness:.040,axis:2},material:{kind:'default',color:paint,roughness:.18,metalness:.10}},
  {id:'door-window',position:[.47,1.24,-.964],mesh:{kind:'polygon-prism',points:[[-.56,-.16],[.56,-.16],[.43,.17],[-.45,.17]],thickness:.016,axis:2},material:{kind:'default',color:[.016,.026,.034,1],roughness:.07,metalness:.12,pattern:'window'}},
  ...human,
 ],
});
const rig=new M3InteractionRig(1700);rig.setTemperatureC(15);const script=createVehicleAbuseScript(rig);
const baseParts=new Map(carEntities.map(part=>[part.id,{position:[...part.position],rotation:[...(part.rotation??[0,0,0])]}]));
const bodyBase=geometry.body;let simSteps=0;const events=[],telemetry=[];
const mix=(a,b,t)=>a+(b-a)*t;

const rotate=(p,r)=>{const [rx,,rz]=r,sx=Math.sin(rx),cx=Math.cos(rx),sz=Math.sin(rz),cz=Math.cos(rz);let [x,y,z]=p;const x1=x*cz-y*sz,y1=x*sz+y*cz;return[x1,y1*cx-z*sx,y1*sx+z*cx];};
function applyCar(){
 const state=rig.state,pose=state.suspension,rotation=[pose.roll,0,pose.pitch],scale=state.thermalScale;
 for(const [id,base] of baseParts){
  const e=scene.entities.get(id);if(!e)continue;
  const p=id==='m3-body'?[0,0,0]:[base.position[0]*scale,base.position[1],base.position[2]*scale],q=rotate(p,rotation);
  e.position.splice(0,3,q[0],q[1]+pose.heave,q[2]);e.rotation.splice(0,3,base.rotation[0]+rotation[0],base.rotation[1],base.rotation[2]+rotation[2]);
 }
 const body=scene.entities.get('m3-body');body.mesh=rig.shellMesh(bodyBase);
 const theta=-rig.door.angle,hinge=[.98,.77,-.952],dx=-.55,c=Math.cos(theta),s=Math.sin(theta),doorLocal=[hinge[0]+c*dx,hinge[1],hinge[2]-s*dx],doorWorld=rotate(doorLocal,rotation);
 const door=scene.entities.get('door-panel'),glass=scene.entities.get('door-window'),opening=scene.entities.get('door-opening');
 door.position.splice(0,3,doorWorld[0],doorWorld[1]+pose.heave,doorWorld[2]);door.rotation.splice(0,3,rotation[0],theta,rotation[2]);
 const winOffset=rotate([0,.47,0],rotation);glass.position.splice(0,3,doorWorld[0]+winOffset[0],doorWorld[1]+pose.heave+winOffset[1],doorWorld[2]+winOffset[2]);glass.rotation.splice(0,3,rotation[0],theta,rotation[2]);
 const op=rotate([.43,.77,-.947],rotation);opening.position.splice(0,3,op[0],op[1]+pose.heave,op[2]);opening.rotation.splice(0,3,...rotation);
}
function bone(id,a,b,width){
 const e=scene.entities.get('person:'+id),d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],len=Math.hypot(...d)||.001;
 e.position.splice(0,3,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);
 e.scale.splice(0,3,width,len,width);e.rotation.splice(0,3,Math.atan2(d[2],d[1]),0,Math.asin(Math.max(-1,Math.min(1,-d[0]/len))));
}
function applyHuman(time){
 const p=humanPose(time),r=p.root,walk=p.action==='walk'?Math.sin(p.strike*Math.PI*2):0;
 let lf=[r[0]-.11,r[1]+.05,r[2]-.11],rf=[r[0]+.11,r[1]+.05,r[2]+.11];
 if(p.action==='walk'){lf=[r[0]-.18*walk,r[1]+.05+Math.max(0,walk)*.08,r[2]-.12];rf=[r[0]+.18*walk,r[1]+.05+Math.max(0,-walk)*.08,r[2]+.12];}
 if(p.action==='hood'){lf=[r[0]-.12,r[1]+(p.side<0?0:.08),r[2]-.24];rf=[r[0]+.12,r[1]+(p.side>0?0:.08),r[2]+.24];}
 if(p.action==='roof'){lf=[r[0]-.14,r[1],r[2]-.16];rf=[r[0]+.14,r[1],r[2]+.16];}
 if(p.action==='kick'){
   const k=Math.sin(Math.PI*Math.max(0,Math.min(1,(p.strike-.08)/.55)))**2;
   lf=[r[0]-.13,r[1]+.05,r[2]-.09];rf=[r[0]+.10,r[1]+.08+.28*k,r[2]+.12+.58*k];
 }
 const hipY=r[1]+.88,lh=[r[0]-.08,hipY,r[2]-.13],rh=[r[0]+.08,hipY,r[2]+.13],lk=[(lh[0]+lf[0])/2-.05,(lh[1]+lf[1])/2,r[2]-.13],rk=[(rh[0]+rf[0])/2+.05,(rh[1]+rf[1])/2,r[2]+.13];
 const chest=[r[0],r[1]+1.26,r[2]],ls=[r[0],r[1]+1.43,r[2]-.22],rs=[r[0],r[1]+1.43,r[2]+.22];
 let lhnd=[r[0]-.18,r[1]+1.05,r[2]-.32],rhnd=[r[0]+.18,r[1]+1.05,r[2]+.32];
 if(p.action==='door'){rhnd=[.62,1.00,-1.03];lhnd=[r[0]-.2,1.05,r[2]-.25];}
 if(p.action==='hand'){
   const targets=time<8.75?[[.05,1.43,-.18],8.35]:time<9.65?[[.45,1.12,-.945],9.18]:[[1.35,.96,-.08],10.03];
   const pulse=Math.exp(-(((time-targets[1])/.11)**2)),target=targets[0];
   rhnd=[mix(rs[0],target[0],pulse),mix(rs[1]-.15,target[1],pulse),mix(rs[2],target[2],pulse)];
 }
 if(p.action==='hood'||p.action==='roof'){lhnd=[r[0]-.30,r[1]+1.12,r[2]-.35];rhnd=[r[0]+.30,r[1]+1.12,r[2]+.35];}
 if(p.action==='kick'){lhnd=[r[0]-.22,r[1]+1.08,r[2]-.26];rhnd=[r[0]+.18,r[1]+1.12,r[2]+.24];}
 const le=[(ls[0]+lhnd[0])/2-.05,(ls[1]+lhnd[1])/2, (ls[2]+lhnd[2])/2],re=[(rs[0]+rhnd[0])/2+.05,(rs[1]+rhnd[1])/2,(rs[2]+rhnd[2])/2];
 const torso=scene.entities.get('person:torso');torso.position.splice(0,3,...chest);torso.scale.splice(0,3,.42,.68,.32);
 const head=scene.entities.get('person:head');head.position.splice(0,3,r[0],r[1]+1.78,r[2]);head.scale.splice(0,3,.20,.23,.19);
 bone('l-thigh',lh,lk,.15);bone('l-shin',lk,lf,.13);bone('r-thigh',rh,rk,.15);bone('r-shin',rk,rf,.13);
 bone('l-upper-arm',ls,le,.12);bone('l-forearm',le,lhnd,.10);bone('r-upper-arm',rs,re,.12);bone('r-forearm',re,rhnd,.10);
 for(const [id,pos] of [['l-hand',lhnd],['r-hand',rhnd]]){const e=scene.entities.get('person:'+id);e.position.splice(0,3,...pos);e.scale.splice(0,3,.105,.105,.105);}
 for(const [id,pos] of [['l-foot',lf],['r-foot',rf]]){const e=scene.entities.get('person:'+id);e.position.splice(0,3,...pos);e.scale.splice(0,3,.28,.08,.14);}
}
function cameraAt(t){
 if(t<7.9)return{position:[4.9,1.72,-5.15],target:[.28,.82,-.10],fov:39,focusDistance:7,aperture:.032};
 if(t<10.8)return{position:[3.65,1.45,-3.72],target:[.82,1.08,-.24],fov:37,focusDistance:5.6,aperture:.028};
 if(t<16.8)return{position:[4.05,1.62,-3.45],target:[1.02,.95,0],fov:36,focusDistance:5.3,aperture:.026};
 if(t<22.8)return{position:[3.05,1.92,-3.20],target:[-.04,1.18,0],fov:35,focusDistance:4.9,aperture:.028};
 if(t<30.4)return{position:[3.85,1.42,-3.72],target:[.10,.78,-.18],fov:37,focusDistance:5.3,aperture:.024};
 return{position:[3.00,1.18,-2.72],target:[.72,.96,-.06],fov:32,focusDistance:4.0,aperture:.022};
}
async function reset(){
 simSteps=0;events.length=0;telemetry.length=0;
 window.rig=rig;
}
await renderer.prepareMaterials(scene);
window.ready=true;window.failure=null;
window.demo={
 duration:VEHICLE_ABUSE_DURATION,
 async reset(){location.reload();},
 async frame(t){
   const desired=Math.max(0,Math.round(t*120));
   while(simSteps<desired){
     script.step(1/120);events.push(...rig.drainEvents());simSteps++;
     if(simSteps%2===0)scene.step(1/60);
   }
   applyCar();applyHuman(t);scene.camera=cameraAt(t);
   const phase=phaseAt(t),state=rig.state;
   document.getElementById('phase').textContent=phase.label;
   document.getElementById('metrics').textContent=
     'sunny yard · 15 °C\n'+
     'elastic     '+(state.panelElasticDepthM*1000).toFixed(1)+' mm\n'+
     'permanent   '+(state.panelPermanentDepthM*1000).toFixed(1)+' mm\n'+
     'suspension  '+(state.suspension.heave*1000).toFixed(1)+' mm\n'+
     'door        '+(state.doorAngle*180/Math.PI).toFixed(0)+'°';
   telemetry.push({t,state:structuredClone(state),phase:phase.label});
   await renderer.prepareMaterials(scene);renderer.render(scene);await renderer.flush();
   return this.inspect();
 },
 inspect(){return{...renderer.inspect(),time:simSteps/120,state:rig.state,events:events.length,phase:phaseAt(simSteps/120).label};},
 events(){return events;},telemetry(){return telemetry;}
};
applyCar();applyHuman(0);renderer.render(scene);await renderer.flush();
}catch(error){
  window.failure=error?.stack??String(error);console.error(error);
}
</script>
