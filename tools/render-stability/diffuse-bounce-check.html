<!doctype html>
<meta charset="utf-8">
<title>Diffuse bounce energy regression</title>
<pre id="result">Running production WGSL checks…</pre>
<script type="module">
import {EFFECTS_SHADER} from '/dist/render/lighting.js';
const result=document.querySelector('#result');
let device;
try {
 const adapter=await navigator.gpu?.requestAdapter();
 if(!adapter)throw Error('WebGPU unavailable');
 device=await adapter.requestDevice();
 const kernel=EFFECTS_SHADER.match(/fn diffuseBounceRadiance\([\s\S]*?\n\}/)?.[0];
 if(!kernel)throw Error('Production diffuse kernel missing');
 if(!EFFECTS_SHADER.includes('indirect+=diffuseBounceRadiance('))throw Error('Production effects do not use the tested kernel');
 const cases=[
  {name:'tangent receiver',receive:0,emit:1,distance:.1,expected:0},
  {name:'back-facing emitter',receive:1,emit:0,distance:.1,expected:0},
  {name:'out of range',receive:1,emit:1,distance:.83,expected:0},
  {name:'six full samples conserve the authored gain',receive:1,emit:1,distance:.05,expected:.034/6},
  {name:'grazing transfer stays weak',receive:.001,emit:1,distance:.05,expected:.034/6000},
  {name:'emitter cosine attenuates energy',receive:1,emit:.1,distance:.05,expected:.034/60},
  {name:'both cosines survive integration',receive:.1,emit:.1,distance:.05,expected:.034/600},
  {name:'range attenuation survives integration',receive:1,emit:1,distance:.45,expected:.034/12},
 ];
 const input=new Float32Array(cases.flatMap(c=>[c.receive,c.emit,c.distance,0]));
 const source=device.createBuffer({size:input.byteLength,usage:0x80|0x08});
 const output=device.createBuffer({size:cases.length*4,usage:0x80|0x04});
 const readback=device.createBuffer({size:cases.length*4,usage:0x01|0x08});
 device.queue.writeBuffer(source,0,input);
 device.pushErrorScope('validation');
 const module=device.createShaderModule({code:kernel+`
 @group(0) @binding(0) var<storage,read> samples:array<vec4<f32>>;
 @group(0) @binding(1) var<storage,read_write> answers:array<f32>;
 @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id:vec3<u32>){
  let c=samples[id.x];answers[id.x]=diffuseBounceRadiance(c.x,c.y,c.z,vec3<f32>(1)).x;
 }`});
 const pipeline=await device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'main'}});
 const bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:source}},{binding:1,resource:{buffer:output}}]});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();
 pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.dispatchWorkgroups(cases.length);pass.end();
 encoder.copyBufferToBuffer(output,0,readback,0,cases.length*4);device.queue.submit([encoder.finish()]);
 await readback.mapAsync(1);const values=new Float32Array(readback.getMappedRange()).slice();readback.unmap();
 const error=await device.popErrorScope();if(error)throw Error(error.message);
 const checks=cases.map((c,i)=>({...c,actual:values[i],passed:Math.abs(c.expected-values[i])<1e-8}));
 result.textContent=JSON.stringify({status:checks.every(c=>c.passed)?'passed':'failed',adapter:adapter.info,checks},null,2);
 for(const buffer of [source,output,readback])buffer.destroy();
} catch(error) {result.textContent=JSON.stringify({status:'failed',error:String(error)},null,2);}
finally {device?.destroy();}
</script>
