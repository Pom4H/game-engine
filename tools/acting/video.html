<!doctype html><html lang="ru"><meta charset="utf-8"><title>NPC — эмоции и отношения</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18232a;font-family:Arial,sans-serif;color:#fff}#world{width:100%;height:100%;display:block}#top{position:absolute;top:20px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 8px #000}#title{font-size:19px;font-weight:700;letter-spacing:1.2px}#phase{font-size:23px;font-weight:700}#cards{position:absolute;top:70px;left:32px;right:32px;display:flex;justify-content:space-between;pointer-events:none}.card{width:233px;background:#101e27d9;padding:13px 16px;border-radius:11px;border-top:3px solid #db9879;box-shadow:0 3px 12px #0003}.card.mira{border-color:#86bdcf}.name{font-size:18px;font-weight:bold}.action{font-size:14px;color:#d3dce2;margin-top:5px}.row{font-size:12px;margin-top:8px;color:#ccd5dc;display:flex;justify-content:space-between}.bar{height:4px;background:#ffffff22;border-radius:8px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#e8b27d}.bar.relation i{background:#8fc8c0}#sub{position:absolute;bottom:58px;left:11%;right:11%;text-align:center;font-size:25px;line-height:1.4;font-weight:600;text-shadow:0 2px 3px #000;background:#10202bdc;border-radius:12px;padding:12px 20px;min-height:60px}#footer{position:absolute;bottom:18px;left:32px;right:32px;display:flex;justify-content:space-between;font-size:12px;color:#dce5ec;text-shadow:0 1px 3px #000}#tag{position:absolute;bottom:143px;left:0;right:0;text-align:center;font-size:17px;text-shadow:0 2px 5px #000}
</style><canvas id="world"></canvas><div id="top"><span id="title">THE ENGINE · NPC</span><span id="phase"></span></div><div id="cards"></div><div id="tag"></div><div id="sub"></div><div id="footer"><span>Постановочная сцена · штатные персонажи, IK, мимика и модель отношений движка</span><span id="time"></span></div>
<script type="module">
import {WebGPURenderer} from '/dist/render/webgpu.js';
import {createActingVideo} from './video-scene.mjs';
try{
 const plan=await(await fetch('/plan.json')).json(),play=createActingVideo(plan),canvas=document.getElementById('world');canvas.width=1280;canvas.height=720;
 const renderer=await WebGPURenderer.create(canvas,{profiling:false});renderer.setResolution(1280,720);renderer.configurePostProcessing({temporalAA:true,bloom:false,motionBlur:0});renderer.setBackgroundEnvironmentMaps(true);
 await renderer.prepareMaterials(play.scene);let tick=0,shot=null,renderFrame=0;
 const drawHUD=s=>{document.getElementById('phase').textContent=s.phase;document.getElementById('sub').textContent=s.subtitle||' ';document.getElementById('time').textContent=s.timeS.toFixed(1)+' с';
  document.getElementById('tag').textContent=s.lampOn?'Помощь подтверждена: фонарь включён':s.events.length?'Не смогла сразу помочь — доброжелательность не снизилась':'';
  document.getElementById('cards').innerHTML=[...s.actors].reverse().map(a=>{const v=a.affect.valence,relation=a.sentiment;return `<div class="card ${a.id}"><div class="name">${a.name}</div><div class="action">${a.label} · ${v<-.08?'разочарование':v>.12?'радость':'спокойствие'}</div><div class="row"><span>Эмоция</span><span>${v>0?'+':''}${v.toFixed(2)}</span></div><div class="bar"><i style="width:${Math.abs(v)*100}%"></i></div><div class="row"><span>Доброжелательность</span><span>${Math.round(relation.benevolence*100)}%</span></div><div class="bar relation"><i style="width:${relation.benevolence*100}%"></i></div><div class="row"><span>Надёжность партнёра</span><span>${Math.round(relation.reliability*100)}%</span></div></div>`;}).join('');};
 window.actingVideo={duration:plan.duration,async frame(timeS){const target=Math.round(timeS*60);if(target<tick)throw new Error('Cannot reverse the capture clock');while(tick<target){tick++;play.step(tick/60,1/60);}const state=play.inspect();if(shot!==state.shot){renderer.resetTemporalHistory();shot=state.shot;}renderer.setTimelineFrame(renderFrame++);renderer.render(play.scene);await renderer.flush();const stats=renderer.inspect();if(stats.errors.length||stats.environmentBaking.failed)throw new Error(JSON.stringify(stats));drawHUD(state);await new Promise(requestAnimationFrame);return{state,renderer:{...stats,profile:undefined}};},inspect(){return play.inspect();}};
 await window.actingVideo.frame(0);window.videoReady=true;
}catch(e){window.videoError=e.stack??String(e);console.error(e);}
</script></html>
