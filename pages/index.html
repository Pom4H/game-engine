<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Game Engine — Winter Street</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a;color:#eef4ff;font:14px/1.4 system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
header{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:3;display:flex;gap:6px;align-items:center;pointer-events:none}
.brand{background:#07101ab8;border:1px solid #ffffff22;padding:7px 9px;font:11px ui-monospace,monospace;letter-spacing:.06em;white-space:nowrap}
.controls{margin-left:auto;display:flex;gap:5px;pointer-events:auto;overflow-x:auto;max-width:min(72vw,720px);padding-bottom:2px}
button{appearance:none;border:1px solid #ffffff2d;background:#111a27cc;color:#fff;padding:7px 9px;font:12px/1.2 system-ui,sans-serif;cursor:pointer;white-space:nowrap;min-height:34px}
button:hover{background:#1a2637}
button[data-active="true"]{background:#254064;border-color:#ffffff55}
#status{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));z-index:3;background:#07101ab8;border:1px solid #ffffff1f;padding:6px 8px;font:11px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
@media(max-width:700px){.brand{display:none}.controls{margin-left:0;max-width:100%;width:100%}header{justify-content:center}button{padding:6px 8px;font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="brand">GAME ENGINE · WINTER STREET</div>
  <div class="controls">
    <button id="sound">▶︎ Sound</button>
    <button data-time="6">Night</button>
    <button data-time="18">Sunrise</button>
    <button data-time="36.5">Day</button>
    <button id="restart">↺</button>
    <button id="toggle">Play</button>
  </div>
</header>
<canvas data-game-engine></canvas>
<div id="status">loading WebGPU…</div>
<script type="module">
import {BrowserRuntime} from './dist/browser.js';

const scene = await fetch('./scene.json').then(r => {
  if (!r.ok) throw new Error(`scene.json: ${r.status}`);
  return r.json();
});

const canvas = document.querySelector('canvas');
const status = document.querySelector('#status');
const toggle = document.querySelector('#toggle');
const restart = document.querySelector('#restart');
const sound = document.querySelector('#sound');

const runtime = await BrowserRuntime.create(canvas, scene, {autoplay:true, exposeBridge:true, audio:true});
let running = true;
toggle.textContent = 'Pause';

const startWithSound = async event => {
  event?.preventDefault?.();
  sound.disabled = true;
  sound.textContent = '… Sound';
  try {
    const audioReady = await runtime.activateAudio();
    if (!audioReady) {
      sound.disabled = false;
      sound.textContent = '▶︎ Sound';
      status.textContent = 'Audio is blocked by this browser — tap Sound again';
      return;
    }
    runtime.pause();
    runtime.reset();
    runtime.resume();
    running = true;
    toggle.textContent = 'Pause';
    sound.textContent = '🔊 Sound';
    sound.dataset.active = 'true';
  } catch (error) {
    console.error(error);
    sound.disabled = false;
    sound.textContent = '▶︎ Sound';
    status.textContent = `Audio error: ${error?.message ?? error}`;
  }
};

sound.addEventListener('pointerdown', startWithSound, {passive:false});

toggle.onclick = async () => {
  if (running) {
    runtime.pause();
    toggle.textContent = 'Play';
  } else {
    runtime.resume();
    toggle.textContent = 'Pause';
  }
  running = !running;
};

restart.onclick = () => {
  runtime.pause();
  runtime.reset();
  runtime.resume();
  running = true;
  toggle.textContent = 'Pause';
};

for (const button of document.querySelectorAll('[data-time]')) button.onclick = async () => {
  runtime.pause();
  runtime.seek(Number(button.dataset.time));
  running = false;
  toggle.textContent = 'Play';
};

const update = () => {
  const info = runtime.inspect();
  const puddles = info.winter.surfaces.filter(s => s.puddle > .03).length;
  const snow = info.winter.surfaces.filter(s => s.snowDepthM > .005).length;
  status.textContent = `${info.environment.hour.toFixed(1)}h · ${info.environment.temperatureC.toFixed(1)}°C · snow=${info.environment.snowfall} · snow surfaces=${snow} · puddles=${puddles} · audio=${info.audio.state} · WebGPU`;
  requestAnimationFrame(update);
};
update();
</script>
</body>
</html>
