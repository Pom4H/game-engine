<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Game Engine — Winter Street</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a;color:#eef4ff;font:14px/1.4 system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
header{position:fixed;inset:12px 12px auto 12px;z-index:3;display:flex;gap:8px;align-items:center;pointer-events:none}
.brand{background:#07101acc;border:1px solid #ffffff24;padding:8px 10px;font:12px ui-monospace,monospace;letter-spacing:.08em}
.controls{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
button{appearance:none;border:1px solid #ffffff26;background:#111a27d9;color:#fff;padding:8px 11px;font:inherit;cursor:pointer}
button:hover{background:#1a2637}
#status{position:fixed;left:12px;bottom:12px;z-index:3;background:#07101acc;border:1px solid #ffffff20;padding:7px 9px;font:12px ui-monospace,monospace}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#05080dc4;backdrop-filter:blur(4px)}
#start button{font-size:18px;padding:14px 20px;background:#152235;border-color:#ffffff42}
</style>
</head>
<body>
<header>
  <div class="brand">GAME ENGINE · WINTER STREET</div>
  <div class="controls">
    <button data-time="6">Night</button>
    <button data-time="18">Sunrise</button>
    <button data-time="36.5">Day</button>
    <button id="restart">Restart</button>
    <button id="toggle">Pause</button>
  </div>
</header>
<canvas data-game-engine></canvas>
<div id="start"><button id="startButton">Start winter street</button></div>
<div id="status">loading WebGPU…</div>
<script type="module">
import {BrowserRuntime} from './dist/browser.js';

const scene = await fetch('./scene.json').then(r => {
  if (!r.ok) throw new Error(`scene.json: ${r.status}`);
  return r.json();
});

const canvas = document.querySelector('canvas');
const status = document.querySelector('#status');
const toggle = document.querySelector('#toggle');
const restart = document.querySelector('#restart');
const start = document.querySelector('#start');
const startButton = document.querySelector('#startButton');

const runtime = await BrowserRuntime.create(canvas, scene, {autoplay:false, exposeBridge:true, audio:true});
let running = false;
toggle.textContent = 'Play';

const startSimulation = async () => {
  const audioReady = await runtime.activateAudio();
  runtime.pause();
  runtime.reset();
  runtime.resume();
  running = true;
  toggle.textContent = 'Pause';
  start.hidden = true;
  if (!audioReady) status.textContent = 'audio blocked by browser';
};

startButton.onclick = startSimulation;

toggle.onclick = async () => {
  if (running) {
    runtime.pause();
    toggle.textContent = 'Play';
  } else {
    await runtime.activateAudio();
    runtime.resume();
    toggle.textContent = 'Pause';
  }
  running = !running;
};

restart.onclick = async () => {
  await runtime.activateAudio();
  runtime.pause();
  runtime.reset();
  runtime.resume();
  running = true;
  toggle.textContent = 'Pause';
  start.hidden = true;
};

for (const button of document.querySelectorAll('[data-time]')) button.onclick = async () => {
  runtime.pause();
  runtime.seek(Number(button.dataset.time));
  running = false;
  toggle.textContent = 'Play';
  start.hidden = true;
};

const update = () => {
  const info = runtime.inspect();
  const puddles = info.winter.surfaces.filter(s => s.puddle > .03).length;
  const snow = info.winter.surfaces.filter(s => s.snowDepthM > .005).length;
  status.textContent = `t=${info.time.toFixed(1)}s · ${info.environment.hour.toFixed(1)}h · ${info.environment.temperatureC.toFixed(1)}°C · snow=${info.environment.snowfall} · snow surfaces=${snow} · puddles=${puddles} · audio=${info.audio.state} · WebGPU`;
  requestAnimationFrame(update);
};
update();
</script>
</body>
</html>
